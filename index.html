<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, addDoc, query, onSnapshot, orderBy, serverTimestamp, where, deleteDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyDfWReJ-A4J2W5V_FahYjLwfXv3-sNvXZE", authDomain: "dankconnect.firebaseapp.com", projectId: "dankconnect", storageBucket: "dankconnect.firebasestorage.app", messagingSenderId: "248906319926", appId: "1:248906319926:web:704456ec90628c5f2a7097" };
const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);
await setPersistence(auth, browserLocalPersistence);
function applyTheme(t){ if(t==='light'){document.body.classList.add('light-mode');localStorage.setItem('dc_theme','light');let b=document.getElementById('themeBtn');if(b)b.textContent='☀️';} else{document.body.classList.remove('light-mode');localStorage.setItem('dc_theme','dark');let b=document.getElementById('themeBtn');if(b)b.textContent='🌙';}}
const themeBtn=document.getElementById('themeBtn'); if(themeBtn) themeBtn.addEventListener('click',()=>{let cur=document.body.classList.contains('light-mode')?'light':'dark';applyTheme(cur==='light'?'dark':'light')});
(function(){let saved=localStorage.getItem('dc_theme');if(saved){applyTheme(saved);}else{applyTheme('dark');}})();
let currentUsername=null,currentChatId=null,currentChatType='private',currentChatOther=null,currentTab='all',unsubMsgs=null,unsubPriv=null,unsubGroup=null,unsubProfiles=null,unsubPresence=null,cachePrivate=[],cacheGroups=[],typingTimeout=null,presenceInterval=null;
let mediaRecorder=null, audioChunks=[], isRecording=false, recStartTime=0, recTimerInterval=null, currentAudio=null, currentPlayingId=null;
let profilesCache={}, presenceCache={}, replyingTo=null;
const MAX_DURATION = 30;
function cleanU(u){return u.trim().toLowerCase().replace(/[^a-z0-9_]/g,'').slice(0,20)}
function emailFromU(u){return cleanU(u)+"@dankconnect.app"}
function formatTime(sec){let m=Math.floor(sec/60), s=Math.floor(sec%60); return `${m}:${s.toString().padStart(2,'0')}`}
function formatMsgTime(ts){if(!ts) return ''; let d=new Date(ts.seconds*1000); return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function isUserOnline(pres){if(!pres||!pres.lastSeen) return false; if(pres.online===false) return false; let now=Date.now()/1000; let diff=now-pres.lastSeen.seconds; return diff < 40; }
function formatLastSeen(ts){if(!ts) return 'offline'; let now=Date.now()/1000; let diff=now-ts.seconds; if(diff<40) return 'online'; if(diff<3600) return `last seen ${Math.floor(diff/60)}m ago`; if(diff<86400) return `last seen ${Math.floor(diff/3600)}h ago`; let d=new Date(ts.seconds*1000); return `last seen ${d.toLocaleDateString()} ${d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}`;}
function compressImage(file,maxSize=200,quality=0.6){return new Promise((res,rej)=>{let img=new Image();let reader=new FileReader();reader.onload=e=>{img.src=e.target.result};img.onload=()=>{let canvas=document.createElement('canvas');let w=img.width,h=img.height;if(w>h){if(w>maxSize){h*=maxSize/w;w=maxSize}}else{if(h>maxSize){w*=maxSize/h;h=maxSize}}canvas.width=w;canvas.height=h;let ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);let base64=canvas.toDataURL('image/jpeg',quality).split(',')[1];res(base64)};img.onerror=rej;reader.onerror=rej;reader.readAsDataURL(file)});}
function setReply(msgData){replyingTo={id:msgData.id,sender:msgData.sender,text:msgData.text||(msgData.type==='image'?'🖼️ Image':msgData.type==='voice'?'🎤 Voice':'Message'),type:msgData.type||'text'};document.getElementById('replyPreviewSender').textContent='Replying to '+msgData.sender;document.getElementById('replyPreviewText').textContent=replyingTo.text.slice(0,60);document.getElementById('replyPreview').classList.add('active');document.getElementById('msgInput').focus();}
window.clearReply=()=>{replyingTo=null;document.getElementById('replyPreview').classList.remove('active');};
document.getElementById('replyClose').addEventListener('click',()=>clearReply());
window.scrollToMessage=(id)=>{let el=document.getElementById('msg-'+id);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.outline='2px solid #53bdeb';setTimeout(()=>el.style.outline='none',1000);} };
async function handleLogin(){let u=cleanU(document.getElementById('username').value),p=document.getElementById('password').value.trim(),msgEl=document.getElementById('loginMsg');if(u.length<3){msgEl.textContent="Username min 3";return}if(p.length<6){msgEl.textContent="Password min 6";return}document.getElementById('loginBtn').disabled=true;msgEl.textContent="Checking...";let email=emailFromU(u);try{await signInWithEmailAndPassword(auth,email,p);msgEl.style.color="#53bdeb";msgEl.textContent="Welcome "+u}catch(err){if(err.code==='auth/invalid-credential'||err.code==='auth/user-not-found'){try{let cred=await createUserWithEmailAndPassword(auth,email,p);await setDoc(doc(db,"users",cred.user.uid),{username:u,created:serverTimestamp()},{merge:true});await setDoc(doc(db,"usernames",u),{uid:cred.user.uid,username:u},{merge:true});msgEl.style.color="#53bdeb";msgEl.textContent="Created "+u}catch(cErr){msgEl.textContent=cErr.message}}else{msgEl.textContent=err.message}}document.getElementById('loginBtn').disabled=false}
document.getElementById('loginBtn').addEventListener('click',handleLogin);
document.getElementById('myProfileBtn').addEventListener('click',(e)=>openProfileModal(e,currentUsername));
document.getElementById('newChatBtn').addEventListener('click',()=>newPrivateChat());
document.getElementById('chipAll').addEventListener('click',()=>switchTab('all'));
document.getElementById('chipChats').addEventListener('click',()=>switchTab('chats'));
document.getElementById('chipGroups').addEventListener('click',()=>switchTab('groups'));
document.getElementById('chipAddGroup').addEventListener('click',()=>createGroup());
document.getElementById('logoutBtn').addEventListener('click',()=>{if(confirm('Logout?')) doLogout()});
document.getElementById('closeChatBtn').addEventListener('click',()=>closeChat());
document.getElementById('closeProfileBtn').addEventListener('click',()=>closeProfileModal());
document.getElementById('profileModal').addEventListener('click',(e)=>{if(e.target.id==='profileModal') closeProfileModal()});
document.getElementById('imgBtn').addEventListener('click',()=>document.getElementById('imageInput').click());
document.getElementById('sendBtn').addEventListener('click',()=>sendMsg());
document.getElementById('searchInput').addEventListener('input',()=>filterChats());
document.getElementById('msgInput').addEventListener('input',()=>{toggleInputButtons(); if(!currentChatId) return; let metaCol=currentChatType==='private'?"private_chats":"group_chats";let metaDoc2=doc(db,metaCol,currentChatId); setDoc(metaDoc2,{typing:{[currentUsername]:true}},{merge:true}); if(typingTimeout) clearTimeout(typingTimeout); typingTimeout=setTimeout(()=>{setDoc(metaDoc2,{typing:{[currentUsername]:false}},{merge:true});},1500);});
onAuthStateChanged(auth,(user)=>{if(user){let uname=cleanU(user.email.split('@')[0]);currentUsername=uname;localStorage.setItem('dc_user',uname);document.getElementById('loginView').style.display='none';document.getElementById('mainView').style.display='flex';listenAllChats();listenProfiles();listenPresence();loadMyProfile();setPresence(true);startPresenceHeartbeat();}else{setPresence(false);if(presenceInterval) clearInterval(presenceInterval);currentUsername=null;document.getElementById('loginView').style.display='flex';document.getElementById('mainView').style.display='none';document.getElementById('chatView').style.display='none';if(unsubMsgs)unsubMsgs();if(unsubPriv)unsubPriv();if(unsubGroup)unsubGroup();if(unsubProfiles)unsubProfiles();if(unsubPresence)unsubPresence()}});
function getPrivateChatId(a,b){a=cleanU(a);b=cleanU(b);if(a===b)return null;return "private_"+[a,b].sort().join("_")}
async function setPresence(online){if(!currentUsername) return; try{await setDoc(doc(db,"presence",currentUsername),{username:currentUsername,online:online,lastSeen:serverTimestamp()},{merge:true});}catch(e){}}
function startPresenceHeartbeat(){if(presenceInterval) clearInterval(presenceInterval); presenceInterval=setInterval(()=>{setPresence(true);},15000); setInterval(()=>{ renderList(); if(currentChatId&&currentChatType==='private') updateChatHeaderPic(); }, 10000);}
window.addEventListener('pagehide',()=>{ if(currentUsername){ try{ setPresence(false); }catch(e){} }});
function listenAllChats(){if(unsubPriv)unsubPriv(); if(unsubGroup)unsubGroup();let qPrivate=query(collection(db,"private_chats"),where("participants","array-contains",currentUsername));let qGroups=query(collection(db,"group_chats"),where("members","array-contains",currentUsername));unsubPriv=onSnapshot(qPrivate,(snap)=>{cachePrivate=snap.docs.map(d=>({id:d.id,type:'private',...d.data()}));renderList()});unsubGroup=onSnapshot(qGroups,(snap)=>{cacheGroups=snap.docs.map(d=>({id:d.id,type:'group',...d.data()}));renderList()});}
function listenProfiles(){if(unsubProfiles)unsubProfiles();let qProf=collection(db,"user_profiles");unsubProfiles=onSnapshot(qProf,(snap)=>{profilesCache={};snap.forEach(d=>{profilesCache[d.id]=d.data()});renderList();if(currentChatId&&currentChatType==='private') updateChatHeaderPic();let my=profilesCache[currentUsername];if(my&&my.photo){document.getElementById('myAvImg').src='data:image/jpeg;base64,'+my.photo;document.getElementById('myAvImg').style.display='block';document.getElementById('myAvTxt').style.display='none';}});}
function listenPresence(){if(unsubPresence) unsubPresence(); let qPres=collection(db,"presence"); unsubPresence=onSnapshot(qPres,(snap)=>{presenceCache={}; snap.forEach(d=>{presenceCache[d.id]=d.data()}); renderList(); if(currentChatId&&currentChatType==='private') updateChatHeaderPic();});}
async function loadMyProfile(){try{let d=await getDoc(doc(db,"user_profiles",currentUsername));if(d.exists()&&d.data().photo){document.getElementById('myAvImg').src='data:image/jpeg;base64,'+d.data().photo;document.getElementById('myAvImg').style.display='block';document.getElementById('myAvTxt').style.display='none';}}catch(e){}}
function getUnreadCount(c){if(!c) return 0;if(c.unread && typeof c.unread === 'object' && c.unread[currentUsername]!== undefined){return c.unread[currentUsername] || 0;}return 0;}
function renderList(){let list=document.getElementById('chatList');list.innerHTML='';let q=document.getElementById('searchInput').value.toLowerCase();let all=[...cachePrivate,...cacheGroups].sort((a,b)=>(b.lastTime?.seconds||0)-(a.lastTime?.seconds||0));let filtered=all.filter(c=>{if(currentTab==='groups'&&c.type!=='group')return false;if(currentTab==='chats'){let unread=getUnreadCount(c);if(unread===0) return false;}if(!q)return true;if(c.type==='private'){let o=(c.participants||[]).find(p=>p!==currentUsername)||'';return o.includes(q)}else return (c.name||'').toLowerCase().includes(q)});document.getElementById('unreadCount').textContent=cachePrivate.filter(c=>getUnreadCount(c)>0).length;document.getElementById('groupCount').textContent=cacheGroups.length;filtered.forEach(c=>{let row=document.createElement('div');row.className='chat-row';let timeStr=c.lastTime?new Date(c.lastTime.seconds*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';let isTyping=c.typing && Object.keys(c.typing).some(u=>u!==currentUsername && c.typing[u]);let lastText=isTyping?`<span style="color:#8ab4ff;font-weight:700">typing...</span>`:(c.lastMsg||'');if(c.type==='private'){let other=(c.participants||[]).find(p=>p!==currentUsername)||'Unknown';let unread=getUnreadCount(c);let timeCls=unread>0?"chat-time green":"chat-time";let badge=unread>0?`<span class="badge">${unread>9?'9+':unread}</span>`:"";let prof=profilesCache[other];let pres=presenceCache[other];let onlineDot=isUserOnline(pres)?`<div class="online-dot"></div>`:"";let avInner=prof&&prof.photo?`<img src="data:image/jpeg;base64,${prof.photo}">`:other.slice(0,2).toUpperCase();let avHtml=`<div class="av-wrapper"><div class="av profile-trigger" data-user="${other}">${avInner}</div>${onlineDot}</div>`;row.innerHTML=`${avHtml}<div class="chat-info"><div class="chat-top"><span class="chat-name">${other}</span><span class="${timeCls}">${timeStr}</span></div><div class="chat-bottom"><span class="chat-last">${lastText}</span>${badge}</div></div>`;row.addEventListener('click',()=>openPrivate(other));let avEl=row.querySelector('.profile-trigger');if(avEl){avEl.addEventListener('click',(e)=>{e.stopPropagation();openProfileModal(e,other);});}}else{let unread=getUnreadCount(c);let timeCls=unread>0?"chat-time green":"chat-time";let badge=unread>0?`<span class="badge">${unread>9?'9+':unread}</span>`:"";row.innerHTML=`<div class="av" style="background:#5b5bff">${c.name?.slice(0,2).toUpperCase()}</div><div class="chat-info"><div class="chat-top"><span class="chat-name">${c.name}</span><span class="${timeCls}">${timeStr}</span></div><div class="chat-bottom"><span class="chat-last">${lastText}</span>${badge}</div></div>`;row.addEventListener('click',()=>openGroup(c.id,c.name));}list.appendChild(row);});}
function switchTab(t){currentTab=t;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));let map={all:'chipAll',chats:'chipChats',groups:'chipGroups'};if(map[t])document.getElementById(map[t]).classList.add('active');renderList()}
function filterChats(){renderList()}
async function newPrivateChat(){let o=prompt("Enter username:");if(!o)return;o=cleanU(o);if(!o||o===currentUsername){alert("Invalid");return}openPrivate(o)}
async function createGroup(){let name=prompt("Group name:");if(!name)return;name=name.trim().slice(0,30);let membersRaw=prompt("Members comma separated:");let members=membersRaw?membersRaw.split(',').map(cleanU).filter(Boolean):[];members=[...new Set([currentUsername,...members])];let id="group_"+Date.now()+"_"+cleanU(name);await setDoc(doc(db,"group_chats",id),{name:name,members:members,createdBy:currentUsername,createdAt:serverTimestamp(),lastMsg:"Group created",lastTime:serverTimestamp()});openGroup(id,name)}
function updateChatHeaderPic(){if(currentChatType!=='private') return;let other=currentChatOther;let prof=profilesCache[other];let pres=presenceCache[other];let avEl=document.getElementById('chatAv');avEl.style.cursor='pointer'; avEl.onclick=(e)=>openProfileModal(e,other); if(prof&&prof.photo){avEl.innerHTML=`<img src="data:image/jpeg;base64,${prof.photo}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;}else{avEl.textContent=other.slice(0,2).toUpperCase();} let statusEl=document.getElementById('chatStatus'); if(isUserOnline(pres)){statusEl.textContent='online'; statusEl.style.color='#53bdeb';} else if(pres&&pres.lastSeen){statusEl.textContent=formatLastSeen(pres.lastSeen); statusEl.style.color='#8b8ba7';} else {statusEl.textContent='offline'; statusEl.style.color='#8b8ba7';}}
async function openPrivate(other){currentChatOther=other;currentChatType='private';currentChatId=getPrivateChatId(currentUsername,other);document.getElementById('chatName').textContent=other;updateChatHeaderPic();showChat();try{let existing=cachePrivate.find(c=>c.id===currentChatId);let otherUnread=existing?.unread?.[other]||0;await setDoc(doc(db,"private_chats",currentChatId),{participants:[currentUsername,other].sort(),lastTime:serverTimestamp(),unread:{[currentUsername]:0,[other]:otherUnread}},{merge:true});}catch(e){}listenMessages()}
async function openGroup(id,name){currentChatType='group';currentChatId=id;currentChatOther=null;document.getElementById('chatName').textContent=name;document.getElementById('chatAv').textContent=name.slice(0,2).toUpperCase();document.getElementById('chatAv').onclick=null;document.getElementById('chatStatus').textContent=name+' group';document.getElementById('chatStatus').style.color='rgba(255,255,255,0.7)';showChat();try{let existing=cacheGroups.find(c=>c.id===id);let unreadMap={};if(existing?.unread){Object.keys(existing.unread).forEach(k=>{unreadMap[k]=existing.unread[k]});}unreadMap[currentUsername]=0;await setDoc(doc(db,"group_chats",currentChatId),{unread:unreadMap},{merge:true});}catch(e){}listenMessages()}
function showChat(){document.getElementById('mainView').style.display='none';document.getElementById('chatView').style.display='flex'}
function closeChat(){if(unsubMsgs)unsubMsgs();document.getElementById('chatView').style.display='none';document.getElementById('mainView').style.display='flex';currentChatId=null;currentChatOther=null;document.getElementById('typingIndicator').style.display='none';clearReply();}
function toggleInputButtons(){let inp=document.getElementById('msgInput');let mic=document.getElementById('micBtn');let send=document.getElementById('sendBtn');let img=document.getElementById('imgBtn');if(!inp||!mic||!send) return;if(inp.value.trim().length>0){mic.style.display='none';img.style.display='none';send.style.display='flex';}else{mic.style.display='flex';img.style.display='flex';send.style.display='none';}}
function listenMessages(){if(unsubMsgs)unsubMsgs();let box=document.getElementById('msgs');box.innerHTML='Loading...';let col;if(currentChatType==='private')col=collection(db,"private_chats",currentChatId,"messages");else if(currentChatType==='group')col=collection(db,"group_chats",currentChatId,"messages");else col=collection(db,"messages");let q=query(col,orderBy("time","asc"));unsubMsgs=onSnapshot(q,async(snap)=>{box.innerHTML='';let toMark=[];snap.forEach(d=>{let data=d.data();let div=document.createElement('div');let isMe=data.sender===currentUsername||data.uid===auth.currentUser?.uid;div.className='bubble '+(isMe?'me':'other');div.id='msg-'+d.id;let timeStr=formatMsgTime(data.time);let seen=data.seen||false;let ticksHtml='';if(isMe){let cls=seen?'blue':'grey';let tickIcon='✓✓';ticksHtml=`<div class="msg-footer"><span class="msg-time">${timeStr}</span><span class="ticks ${cls}">${tickIcon}</span></div>`;}else{ticksHtml=`<div class="msg-footer"><span class="msg-time">${timeStr}</span></div>`; if(currentChatType==='private' &&!data.seen){toMark.push(d.id);}}
let replyHtml='';if(data.replyTo){let r=data.replyTo;let senderCls=isMe?'me-sender':'';let quoteCls=isMe?'me-quote':'';replyHtml=`<div class="reply-quote ${quoteCls}" onclick="scrollToMessage('${r.id}')"><div class="reply-sender ${senderCls}">${r.sender}</div><div class="reply-text">${(r.text||'').slice(0,80)}</div></div>`;}
let actionsHtml=`<div class="bubble-actions"><div class="bubble-action" title="Reply">↩️</div></div>`;
if(data.type==='voice' && data.audioBase64){let dur=data.duration||0;let id=d.id;div.innerHTML=`${replyHtml}<div class="msg-content"><div class="voice-bubble"><div class="voice-play" id="play-${id}">▶️</div><div class="voice-wave">${Array(16).fill(0).map(()=>`<div class="voice-wave-bar" style="height:${8+Math.random()*16}px"></div>`).join('')}</div><div class="voice-meta"><span class="voice-duration">${formatTime(dur)}</span></div></div></div>${ticksHtml}${actionsHtml}`;div.dataset.audio=data.audioBase64;div.dataset.mime=data.mimeType||'audio/webm';}else if(data.type==='image' && data.imageBase64){div.classList.add('image-bubble');div.innerHTML=`${replyHtml}<div class="msg-content"><img src="data:image/jpeg;base64,${data.imageBase64}"><div style="font-size:12px;margin-top:4px;opacity:0.8">${data.text||''}</div></div>${ticksHtml}${actionsHtml}`;}else{div.innerHTML=`${replyHtml}<div class="msg-content">${data.text||''}</div>${ticksHtml}${actionsHtml}`;}
let replyBtn=div.querySelector('.bubble-action');if(replyBtn){replyBtn.addEventListener('click',(e)=>{e.stopPropagation();setReply({id:d.id,sender:data.sender,text:data.text||'',type:data.type});});}
div.addEventListener('dblclick',()=>{setReply({id:d.id,sender:data.sender,text:data.text||'',type:data.type});});
if(isMe){div.addEventListener('contextmenu',(e)=>{e.preventDefault();if(confirm('Delete message?')) deleteDoc(doc(col,d.id));});}
let playBtn=div.querySelector(`#play-${d.id}`);if(playBtn){playBtn.addEventListener('click',()=>playVoiceBase64(d.id));}
let imgEl=div.querySelector('img');if(imgEl){imgEl.addEventListener('click',()=>window.open(imgEl.src));}
box.appendChild(div)});box.scrollTop=box.scrollHeight; if(toMark.length>0 && currentChatType==='private'){for(let id of toMark){try{await updateDoc(doc(col,id),{seen:true,seenAt:serverTimestamp()});}catch(e){}} } });}
window.playVoiceBase64=(id)=>{let bubble=document.getElementById('msg-'+id);if(!bubble) return;let base64=bubble.dataset.audio;let mime=bubble.dataset.mime||'audio/webm';if(currentAudio){currentAudio.pause();let old=document.getElementById('play-'+currentPlayingId);if(old) old.textContent='▶️';if(currentPlayingId===id){currentAudio=null;currentPlayingId=null;return;}}try{let binary=atob(base64);let bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);let blob=new Blob([bytes],{type:mime});let url=URL.createObjectURL(blob);let audio=new Audio(url);currentAudio=audio;currentPlayingId=id;let btn=document.getElementById('play-'+id);if(btn) btn.textContent='⏸️';audio.onended=()=>{if(btn) btn.textContent='▶️';URL.revokeObjectURL(url);currentAudio=null;currentPlayingId=null;};audio.play().catch(()=>{alert('Play failed');});}catch(e){alert('Error: '+e.message);}};
function blobToBase64(blob){return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onloadend=()=>{let base64=reader.result.split(',')[1];resolve(base64);};reader.onerror=reject;reader.readAsDataURL(blob);});}
async function startRecording(){if(isRecording) return;try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});let mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':MediaRecorder.isTypeSupported('audio/mp4')?'audio/mp4':'audio/webm';mediaRecorder=new MediaRecorder(stream,{mimeType:mime});audioChunks=[];mediaRecorder.ondataavailable=e=>{if(e.data.size>0) audioChunks.push(e.data);};mediaRecorder.onstop=async()=>{await handleRecordingStop(mime);stream.getTracks().forEach(t=>t.stop());};mediaRecorder.start();isRecording=true;recStartTime=Date.now();document.getElementById('msgInput').style.display='none';document.getElementById('recordingBar').classList.add('active');document.getElementById('micBtn').classList.add('recording');document.getElementById('micBtn').textContent='⏹️';recTimerInterval=setInterval(()=>{let elapsed=Math.floor((Date.now()-recStartTime)/1000);document.getElementById('recTimer').textContent=formatTime(elapsed);if(elapsed>=MAX_DURATION){stopRecording();}},200);}catch(err){alert('Mic denied: '+err.message);}}
async function stopRecording(){if(!isRecording||!mediaRecorder) return;isRecording=false;clearInterval(recTimerInterval);document.getElementById('recordingBar').classList.remove('active');document.getElementById('micBtn').classList.remove('recording');document.getElementById('micBtn').textContent='🎤';document.getElementById('msgInput').style.display='block';if(mediaRecorder.state!=='inactive') mediaRecorder.stop();}
async function handleRecordingStop(mimeType){if(audioChunks.length===0) return;let blob=new Blob(audioChunks,{type:mimeType});let duration=Math.floor((Date.now()-recStartTime)/1000);if(duration<1){alert('Too short');return;}if(duration>MAX_DURATION) duration=MAX_DURATION;try{let base64=await blobToBase64(blob);if(base64.length>900000){alert('Voice too long!');return;}if(!currentChatId) throw new Error('No chat');let col;if(currentChatType==='private')col=collection(db,"private_chats",currentChatId,"messages");else if(currentChatType==='group')col=collection(db,"group_chats",currentChatId,"messages");else col=collection(db,"messages");let isGroup=currentChatType==='group';let payload={type:'voice',audioBase64:base64,mimeType:mimeType,duration:duration,sender:currentUsername,uid:auth.currentUser.uid,time:serverTimestamp(),text:'',seen:isGroup};if(replyingTo) payload.replyTo=replyingTo;await addDoc(col,payload);clearReply();let lastTxt=`🎤 Voice ${formatTime(duration)}`;if(currentChatType==='private'){let other=currentChatOther||currentChatId.replace('private_','').split('_').find(p=>p!==currentUsername);let existing=cachePrivate.find(c=>c.id===currentChatId);let unreadMap=existing?.unread?{...existing.unread}:{};unreadMap[other]=(unreadMap[other]||0)+1;unreadMap[currentUsername]=0;await setDoc(doc(db,"private_chats",currentChatId),{lastMsg:lastTxt,lastTime:serverTimestamp(),participants:[currentUsername,other].sort(),unread:unreadMap},{merge:true});}if(currentChatType==='group'){let g=cacheGroups.find(x=>x.id===currentChatId);let members=g?.members||[];let existing=g?.unread?{...g.unread}:{};members.forEach(m=>{if(m!==currentUsername) existing[m]=(existing[m]||0)+1;});existing[currentUsername]=0;await setDoc(doc(db,"group_chats",currentChatId),{lastMsg:currentUsername+": "+lastTxt,lastTime:serverTimestamp(),unread:existing},{merge:true});}}catch(e){alert('Failed: '+e.message);}}
async function sendMsg(){let txt=document.getElementById('msgInput').value.trim();if(!txt||!currentChatId)return;document.getElementById('msgInput').value='';toggleInputButtons();let col;if(currentChatType==='private')col=collection(db,"private_chats",currentChatId,"messages");else if(currentChatType==='group')col=collection(db,"group_chats",currentChatId,"messages");else col=collection(db,"messages");let isGroup=currentChatType==='group';let payload={text:txt,sender:currentUsername,uid:auth.currentUser.uid,time:serverTimestamp(),type:'text',seen:isGroup};if(replyingTo) payload.replyTo=replyingTo;await addDoc(col,payload);clearReply();if(currentChatType==='private'){let other=currentChatOther||currentChatId.replace('private_','').split('_').find(p=>p!==currentUsername);let existing=cachePrivate.find(c=>c.id===currentChatId);let unreadMap=existing?.unread?{...existing.unread}:{};unreadMap[other]=(unreadMap[other]||0)+1;unreadMap[currentUsername]=0;await setDoc(doc(db,"private_chats",currentChatId),{lastMsg:txt,lastTime:serverTimestamp(),participants:[currentUsername,other].sort(),unread:unreadMap},{merge:true});}if(currentChatType==='group'){let g=cacheGroups.find(x=>x.id===currentChatId);let members=g?.members||[];let existing=g?.unread?{...g.unread}:{};members.forEach(m=>{if(m!==currentUsername) existing[m]=(existing[m]||0)+1;});existing[currentUsername]=0;await setDoc(doc(db,"group_chats",currentChatId),{lastMsg:currentUsername+": "+txt.slice(0,40),lastTime:serverTimestamp(),unread:existing},{merge:true});}};
let micBtn=document.getElementById('micBtn');micBtn.addEventListener('click',()=>{if(isRecording) stopRecording(); else startRecording();});
document.getElementById('profileInput').addEventListener('change',async(e)=>{let file=e.target.files[0];if(!file) return;if(file.size>5*1024*1024){alert('Image too big, max 5MB');return}try{let base64=await compressImage(file,200,0.7);await setDoc(doc(db,"user_profiles",currentUsername),{username:currentUsername,photo:base64,updated:serverTimestamp()},{merge:true});document.getElementById('myAvImg').src='data:image/jpeg;base64,'+base64;document.getElementById('myAvImg').style.display='block';document.getElementById('myAvTxt').style.display='none';closeProfileModal();}catch(err){alert('Failed: '+err.message)}e.target.value='';});
document.getElementById('imageInput').addEventListener('change',async(e)=>{let file=e.target.files[0];if(!file) return;if(!currentChatId){alert('Open a chat first');return}if(file.size>10*1024*1024){alert('Image too big max 10MB');return}try{let base64=await compressImage(file,800,0.65);if(base64.length>900000){base64=await compressImage(file,600,0.5);}let col;if(currentChatType==='private')col=collection(db,"private_chats",currentChatId,"messages");else if(currentChatType==='group')col=collection(db,"group_chats",currentChatId,"messages");else col=collection(db,"messages");let caption=prompt('Add caption (optional):')||'';let isGroup=currentChatType==='group';let payload={type:'image',imageBase64:base64,text:caption.slice(0,200),sender:currentUsername,uid:auth.currentUser.uid,time:serverTimestamp(),seen:isGroup};if(replyingTo) payload.replyTo=replyingTo;await addDoc(col,payload);clearReply();let lastTxt=`🖼️ ${caption?caption:'Image'}`;if(currentChatType==='private'){let other=currentChatOther||currentChatId.replace('private_','').split('_').find(p=>p!==currentUsername);let existing=cachePrivate.find(c=>c.id===currentChatId);let unreadMap=existing?.unread?{...existing.unread}:{};unreadMap[other]=(unreadMap[other]||0)+1;unreadMap[currentUsername]=0;await setDoc(doc(db,"private_chats",currentChatId),{lastMsg:lastTxt,lastTime:serverTimestamp(),participants:[currentUsername,other].sort(),unread:unreadMap},{merge:true});}if(currentChatType==='group'){let g=cacheGroups.find(x=>x.id===currentChatId);let members=g?.members||[];let existing=g?.unread?{...g.unread}:{};members.forEach(m=>{if(m!==currentUsername) existing[m]=(existing[m]||0)+1;});existing[currentUsername]=0;await setDoc(doc(db,"group_chats",currentChatId),{lastMsg:currentUsername+": "+lastTxt,lastTime:serverTimestamp(),unread:existing},{merge:true});}}catch(err){alert('Image failed: '+err.message);}e.target.value='';});
function openProfileModal(e,username){if(e){e.preventDefault();e.stopPropagation();} let prof=profilesCache[username]; let pres=presenceCache[username]; let imgEl=document.getElementById('profileModalImg'); let fbEl=document.getElementById('profileModalFallback'); let nameEl=document.getElementById('profileModalName'); let userEl=document.getElementById('profileModalUser'); let actions=document.getElementById('profileModalActions'); nameEl.textContent=username; userEl.textContent='@'+username+' • DANKCONNECT user'; if(prof&&prof.photo){ imgEl.src='data:image/jpeg;base64,'+prof.photo; imgEl.style.display='block'; fbEl.style.display='none'; } else { imgEl.style.display='none'; fbEl.style.display='flex'; fbEl.textContent=username.slice(0,2).toUpperCase(); } if(username===currentUsername){ actions.innerHTML=`<button class="profile-modal-btn primary" id="changePicBtn">Change Pic 📸</button><button class="profile-modal-btn secondary" id="closeModalBtn2">Close</button>`; document.getElementById('changePicBtn').addEventListener('click',()=>document.getElementById('profileInput').click()); document.getElementById('closeModalBtn2').addEventListener('click',()=>closeProfileModal()); } else { actions.innerHTML=`<button class="profile-modal-btn primary" id="msgBtnModal">Message</button><button class="profile-modal-btn secondary" id="closeModalBtn2">Close</button>`; document.getElementById('msgBtnModal').addEventListener('click',()=>openChatFromModal()); document.getElementById('closeModalBtn2').addEventListener('click',()=>closeProfileModal()); } document.getElementById('profileModal').classList.add('active'); document.getElementById('profileModal').dataset.username=username; let statusEl=document.getElementById('profileModalStatus'); if(isUserOnline(pres)){statusEl.textContent='🔵 online'; statusEl.style.color='#53bdeb';} else if(pres&&pres.lastSeen){statusEl.textContent=formatLastSeen(pres.lastSeen); statusEl.style.color='#9a9ab3';} else {statusEl.textContent='offline'; statusEl.style.color='#8b8ba7';}}
function closeProfileModal(){document.getElementById('profileModal').classList.remove('active');}
function openChatFromModal(){let u=document.getElementById('profileModal').dataset.username; if(!u) return; closeProfileModal(); if(u!==currentUsername) openPrivate(u); }
async function doLogout(){await setPresence(false); if(presenceInterval) clearInterval(presenceInterval); signOut(auth);}
window.openProfileModal=openProfileModal; window.closeProfileModal=closeProfileModal; window.openChatFromModal=openChatFromModal; window.doLogout=doLogout; window.openPrivate=openPrivate; window.openGroup=openGroup; window.switchTab=switchTab; window.filterChats=filterChats; window.newPrivateChat=newPrivateChat; window.createGroup=createGroup; window.closeChat=closeChat;
