<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>DANKCONNECT</title>
<meta name="theme-color" content="#0d00b3">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial}
:root{--blue:#0d00b3;--bg:#e9efff}
body{background:var(--bg);height:100dvh;overflow:hidden}
#loginView{height:100dvh;background:var(--blue);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;color:white}
.login-logo{width:120px;height:120px;border-radius:28px;object-fit:cover;background:white;padding:4px}
.login-box{background:white;width:100%;max-width:380px;border-radius:24px;padding:24px;margin-top:26px;color:#111}
.login-box input{width:100%;padding:16px;border-radius:12px;border:1.5px solid #d1d5db;font-size:16px;margin-bottom:12px}
.btn-primary{width:100%;padding:16px;background:var(--blue);color:white;border:none;border-radius:12px;font-weight:800}
#loginMsg{text-align:center;margin-top:12px;font-size:13px;font-weight:700;min-height:18px;color:#d00}
#mainView{display:none;height:100dvh;flex-direction:column;background:var(--bg)}
.top-bar{background:var(--blue);color:white;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;background:white;border-bottom:1px solid #e5e7eb}
.tab{flex:1;padding:14px;text-align:center;font-weight:700;color:#8e8e93;border-bottom:3px solid transparent;cursor:pointer}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.search-wrap{padding:10px 14px;background:white}
.search-wrap input{width:100%;padding:10px 14px;border-radius:20px;border:none;background:#f1f2f6}
.list{flex:1;overflow-y:auto;padding-bottom:80px}
.chat-row{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid rgba(0,0,0,0.05);cursor:pointer;background:white}
.av{width:50px;height:50px;border-radius:50%;background:var(--blue);color:white;display:flex;align-items:center;justify-content:center;font-weight:900;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
#chatView{display:none;height:100dvh;flex-direction:column;background:#dbe5ff}
.chat-head{background:var(--blue);color:white;padding:10px 12px;display:flex;align-items:center;gap:10px}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:78%;padding:10px 12px;border-radius:18px;font-size:14px}
.bubble.me{align-self:flex-end;background:var(--blue);color:white}
.bubble.other{align-self:flex-start;background:white}
.input-bar{display:flex;gap:8px;padding:10px;background:white}
.input-bar input{flex:1;padding:12px 16px;border-radius:25px;border:1px solid #ddd;background:#f2f3f5}
</style>
</head>
<body>
<div id="loginView">
<img src="logo.png" class="login-logo">
<h2 style="margin-top:18px">DANKCONNECT</h2>
<p style="font-size:14px;opacity:0.9;text-align:center;margin-top:6px">Ghana's Secure Chat 🇬🇭<br>Username only</p>
<div class="login-box">
<input id="username" placeholder="Username e.g. dankboy">
<input id="password" type="password" placeholder="Password min 6 chars">
<button id="loginBtn" class="btn-primary">LOGIN / CREATE ACCOUNT</button>
<div id="loginMsg"></div>
</div>
</div>
<div id="mainView">
<div class="top-bar"><h1>DANKCONNECT</h1><div style="display:flex;gap:10px"><div onclick="newPrivateChat()" style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;cursor:pointer">+</div><div onclick="if(confirm('Logout?')) doLogout()" style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center">⋮</div></div></div>
<div class="tabs"><div class="tab active" id="tabChats" onclick="switchTab('chats')">Chats</div><div class="tab" id="tabGroups" onclick="switchTab('groups')">Groups</div></div>
<div class="search-wrap"><input id="searchInput" placeholder="Search..." oninput="filterChats()"></div>
<div class="list" id="chatList"></div>
</div>
<div id="chatView">
<div class="chat-head"><div onclick="closeChat()" style="font-size:28px;cursor:pointer">‹</div><div class="av" id="chatAv">DC</div><div style="flex:1"><div style="font-weight:800" id="chatName">Chat</div><div style="font-size:11px" id="chatStatus">online</div></div><div onclick="startVoiceCall()" style="cursor:pointer">📞</div><div onclick="startVideoCall()" style="cursor:pointer;margin-left:10px">🎥</div></div>
<div class="msgs" id="msgs"></div>
<div class="input-bar"><button onclick="document.getElementById('filePic').click()" style="width:42px;height:42px;border-radius:50%;background:#eef;border:none">📎</button><input type="file" id="filePic" accept="image/*,video/*" style="display:none"><input type="text" id="msgInput" placeholder="Type message..." onkeydown="if(event.key==='Enter') sendMsg()"><button onclick="sendMsg()" style="width:42px;height:42px;border-radius:50%;background:#0d00b3;color:white;border:none">➤</button></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, addDoc, query, onSnapshot, orderBy, serverTimestamp, where, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";
const firebaseConfig = { apiKey: "AIzaSyDfWReJ-A4J2W5V_FahYjLwfXv3-sNvXZE", authDomain: "dankconnect.firebaseapp.com", projectId: "dankconnect", storageBucket: "dankconnect.firebasestorage.app", messagingSenderId: "248906319926", appId: "1:248906319926:web:704456ec90628c5f2a7097" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);
await setPersistence(auth, browserLocalPersistence);
let currentUsername=null,currentChatId=null,currentChatType='private',currentTab='chats',unsubMsgs=null,unsubList=null,allCache=[],cachePrivate=[],cacheGroups=[];
function cleanU(u){return u.trim().toLowerCase().replace(/[^a-z0-9_]/g,'').slice(0,20)}
function emailFromU(u){return cleanU(u)+"@dankconnect.app"}
async function handleLogin(){let u=cleanU(document.getElementById('username').value),p=document.getElementById('password').value.trim(),msgEl=document.getElementById('loginMsg');if(u.length<3){msgEl.textContent="Username min 3";return}if(p.length<6){msgEl.textContent="Password min 6";return}document.getElementById('loginBtn').disabled=true;msgEl.textContent="Checking...";let email=emailFromU(u);try{await signInWithEmailAndPassword(auth,email,p);msgEl.style.color="green";msgEl.textContent="Welcome "+u}catch(err){if(err.code==='auth/invalid-credential'||err.code==='auth/user-not-found'){try{let cred=await createUserWithEmailAndPassword(auth,email,p);await setDoc(doc(db,"users",cred.user.uid),{username:u,created:serverTimestamp()},{merge:true});await setDoc(doc(db,"usernames",u),{uid:cred.user.uid,username:u},{merge:true});msgEl.style.color="green";msgEl.textContent="Created "+u}catch(cErr){msgEl.style.color="red";msgEl.textContent=cErr.message}}else{msgEl.style.color="red";msgEl.textContent=err.message}}document.getElementById('loginBtn').disabled=false}
document.getElementById('loginBtn').addEventListener('click',handleLogin);
onAuthStateChanged(auth,(user)=>{if(user){let uname=cleanU(user.email.split('@')[0]);currentUsername=uname;localStorage.setItem('dc_user',uname);document.getElementById('loginView').style.display='none';document.getElementById('mainView').style.display='flex';listenAllChats()}else{currentUsername=null;document.getElementById('loginView').style.display='flex';document.getElementById('mainView').style.display='none';document.getElementById('chatView').style.display='none';let s=localStorage.getItem('dc_user');if(s)document.getElementById('username').value=s;if(unsubMsgs)unsubMsgs();if(unsubList)unsubList()}});
function getPrivateChatId(a,b){a=cleanU(a);b=cleanU(b);if(a===b)return null;return "private_"+[a,b].sort().join("_")}
function listenAllChats(){if(unsubList)unsubList();let qPrivate=query(collection(db,"private_chats"),where("participants","array-contains",currentUsername),orderBy("lastTime","desc"));let qGroups=query(collection(db,"group_chats"),where("members","array-contains",currentUsername),orderBy("lastTime","desc"));allCache=[];unsubList=onSnapshot(qPrivate,(snap)=>{cachePrivate=snap.docs.map(d=>({id:d.id,type:'private',...d.data()}));merge()});onSnapshot(qGroups,(snap)=>{cacheGroups=snap.docs.map(d=>({id:d.id,type:'group',...d.data()}));merge()})}
function merge(){allCache=[...cachePrivate,...cacheGroups].sort((a,b)=>{let ta=a.lastTime?.seconds||0,tb=b.lastTime?.seconds||0;return tb-ta});renderList()}
function renderList(){let list=document.getElementById('chatList');list.innerHTML='';let filtered=allCache.filter(c=>{if(currentTab==='chats'&&c.type!=='private')return false;if(currentTab==='groups'&&c.type!=='group')return false;let q=document.getElementById('searchInput').value.toLowerCase();if(!q)return true;if(c.type==='private'){let o=(c.participants||[]).find(p=>p!==currentUsername)||'';return o.includes(q)}else return (c.name||'').toLowerCase().includes(q)});if(currentTab==='chats'&&!document.getElementById('searchInput').value){let row=document.createElement('div');row.className='chat-row';row.innerHTML=`<div class="av"><img src="logo.png"></div><div style="flex:1"><b>DANKCONNECT Team</b><br><span style="font-size:13px;color:#666">Official channel</span></div>`;row.onclick=()=>openGeneral();list.appendChild(row)}filtered.forEach(c=>{let row=document.createElement('div');row.className='chat-row';if(c.type==='private'){let other=(c.participants||[]).find(p=>p!==currentUsername)||'Unknown';row.innerHTML=`<div class="av">${other.slice(0,2).toUpperCase()}</div><div style="flex:1"><b>${other}</b><br><span style="font-size:13px">${c.lastMsg||'No messages'}</span></div>`;row.onclick=()=>openPrivate(other)}else{row.innerHTML=`<div class="av" style="background:#00b386">${c.name?.slice(0,2).toUpperCase()}</div><div style="flex:1"><b>${c.name}</b><br><span style="font-size:13px">${c.lastMsg||'Group'} • ${c.members?.length||0} members</span></div>`;row.onclick=()=>openGroup(c.id,c.name)}list.appendChild(row)});if(filtered.length===0&&allCache.length===0){list.innerHTML+='<div style="text-align:center;padding:40px;color:#666">No chats yet<br><br><button onclick="newPrivateChat()" style="padding:12px 18px;background:#0d00b3;color:white;border:none;border-radius:10px">+ Start Private Chat</button><br><br><button onclick="createGroup()" style="padding:12px 18px;background:white;color:#0d00b3;border:1.5px solid #0d00b3;border-radius:10px">+ Create Group</button></div>'}}
window.switchTab=(t)=>{currentTab=t;document.getElementById('tabChats').classList.toggle('active',t==='chats');document.getElementById('tabGroups').classList.toggle('active',t==='groups');renderList()}
window.filterChats=()=>renderList();
window.newPrivateChat=async()=>{let o=prompt("Enter username:");if(!o)return;o=cleanU(o);if(!o||o===currentUsername){alert("Invalid");return}openPrivate(o)};
window.createGroup=async()=>{let name=prompt("Group name:");if(!name)return;name=name.trim().slice(0,30);let membersRaw=prompt("Members comma separated:");let members=membersRaw?membersRaw.split(',').map(cleanU).filter(Boolean):[];members=[...new Set([currentUsername,...members])];let id="group_"+Date.now()+"_"+cleanU(name);await setDoc(doc(db,"group_chats",id),{name:name,members:members,createdBy:currentUsername,createdAt:serverTimestamp(),lastMsg:"Group created",lastTime:serverTimestamp()});openGroup(id,name)};
function openPrivate(other){currentChatType='private';currentChatId=getPrivateChatId(currentUsername,other);document.getElementById('chatName').textContent=other;document.getElementById('chatAv').textContent=other.slice(0,2).toUpperCase();showChat();setDoc(doc(db,"private_chats",currentChatId),{participants:[currentUsername,other].sort(),lastTime:serverTimestamp()},{merge:true});listenMessages()}
window.openGeneral=()=>{currentChatType='general';currentChatId='general';document.getElementById('chatName').textContent='DANKCONNECT Team';document.getElementById('chatAv').innerHTML='<img src="logo.png">';showChat();listenMessages()};
function openGroup(id,name){currentChatType='group';currentChatId=id;document.getElementById('chatName').textContent=name;document.getElementById('chatAv').textContent=name.slice(0,2).toUpperCase();showChat();listenMessages()}
window.openGroup=openGroup;window.openPrivate=openPrivate;
function showChat(){document.getElementById('mainView').style.display='none';document.getElementById('chatView').style.display='flex'}
window.closeChat=()=>{if(unsubMsgs)unsubMsgs();document.getElementById('chatView').style.display='none';document.getElementById('mainView').style.display='flex';currentChatId=null};
function listenMessages(){if(unsubMsgs)unsubMsgs();let box=document.getElementById('msgs');box.innerHTML='Loading...';let col;if(currentChatType==='private')col=collection(db,"private_chats",currentChatId,"messages");else if(currentChatType==='group')col=collection(db,"group_chats",currentChatId,"messages");else col=collection(db,"messages");let q=query(col,orderBy("time","asc"));unsubMsgs=onSnapshot(q,(snap)=>{box.innerHTML='';snap.forEach(d=>{let data=d.data();let div=document.createElement('div');let isMe=data.sender===currentUsername||data.uid===auth.currentUser?.uid;div.className='bubble '+(isMe?'me':'other');if(data.type==='image')div.innerHTML=`<img src="${data.url}" style="max-width:100%;border-radius:10px"><br>${data.text||''}`;else if(data.type==='video')div.innerHTML=`<video controls src="${data.url}" style="max-width:100%;border-radius:10px"></video>`;else div.innerHTML=data.text;box.appendChild(div)});box.scrollTop=box.scrollHeight})}
window.sendMsg=async()=>{let txt=document.getElementById('msgInput').value.trim();if(!txt||!currentChatId)return;document.getElementById('msgInput').value='';let col;if(currentChatType==='private')col=collection(db,"private_chats",currentChatId,"messages");else if(currentChatType==='group')col=collection(db,"group_chats",currentChatId,"messages");else col=collection(db,"messages");await addDoc(col,{text:txt,sender:currentUsername,uid:auth.currentUser.uid,time:serverTimestamp(),type:'text'});if(currentChatType==='private')await setDoc(doc(db,"private_chats",currentChatId),{lastMsg:txt,lastTime:serverTimestamp(),participants:[currentUsername,...currentChatId.replace('private_','').split('_').filter(u=>u!==currentUsername)]},{merge:true});if(currentChatType==='group')await setDoc(doc(db,"group_chats",currentChatId),{lastMsg:currentUsername+": "+txt.slice(0,40),lastTime:serverTimestamp()},{merge:true})};
document.getElementById('filePic').addEventListener('change',async(e)=>{let file=e.target.files[0];if(!file)return;try{let path=`chats/${currentChatId}/${Date.now()}_${file.name}`;let r=ref(storage,path);await uploadBytes(r,file);let url=await getDownloadURL(r);let col;if(currentChatType==='private')col=collection(db,"private_chats",currentChatId,"messages");else if(currentChatType==='group')col=collection(db,"group_chats",currentChatId,"messages");else col=collection(db,"messages");await addDoc(col,{url:url,sender:currentUsername,uid:auth.currentUser.uid,time:serverTimestamp(),type:file.type.startsWith('video')?'video':'image'});if(currentChatType==='private')await setDoc(doc(db,"private_chats",currentChatId),{lastMsg:"📷 Photo",lastTime:serverTimestamp()},{merge:true})}catch(err){alert(err.message)}e.target.value=''});
window.doLogout=()=>signOut(auth);
window.startVoiceCall=()=>alert("Voice call to "+document.getElementById('chatName').textContent+" - WebRTC next step");
window.startVideoCall=()=>alert("Video call - HD coming next");
</script>
</body>
</html>
