<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DankConnect - Splash</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    min-height:100vh;
    color:#fff;
  }
  /* SPLASH */
  #splash{
    background:#100ab6;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  #splash.hidden{display:none}
  .center{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    width:100%;
    padding:20px;
  }
  .logo-wrap{
    background:#fff;
    width:132px;
    height:132px;
    border-radius:32px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:28px;
  }
  .logo-wrap img{width:96px;height:96px;object-fit:contain}
  h1{font-size:42px;font-weight:800;letter-spacing:1px;margin-bottom:12px}
  .sub{font-size:14px;letter-spacing:.5px;margin-bottom:80px;text-align:center}
  .btn-outer{
    background:#fff;
    border-radius:60px;
    padding:18px;
    width:90%;
    max-width:420px;
  }
  .btn-inner{
    background:#100ab6;
    border-radius:45px;
    text-align:center;
    padding:20px;
    font-weight:700;
    font-size:18px;
    color:#fff;
    border:none;
    width:100%;
    cursor:pointer;
  }
  /* AUTH - white and deep blue meeting in middle */
  #auth{
    display:none;
    min-height:100vh;
    background: linear-gradient(to bottom, #ffffff 0%, #ffffff 35%, #a8b0ff 50%, #100ab6 65%, #100ab6 100%);
    align-items:center;
    justify-content:flex-start;
    padding:40px 20px;
    flex-direction:column;
  }
  #auth.show{display:flex}
  .auth-card{
    background:#fff;
    width:100%;
    max-width:400px;
    border-radius:24px;
    padding:32px 24px;
    box-shadow:0 10px 40px rgba(0,0,0,0.18);
    margin-top:6vh;
    text-align:center;
    color:#333;
  }
  .auth-card h2{color:#100ab6;font-size:28px;margin-bottom:8px}
  .auth-card p{color:#666;font-size:14px;margin-bottom:24px}
  .auth-card input{
    width:100%;padding:14px 16px;margin-bottom:14px;
    border:2px solid #e0e0e0;border-radius:12px;font-size:16px;outline:none;
  }
  .auth-card input:focus{border-color:#100ab6}
  .auth-btn{
    width:100%;padding:16px;background:#100ab6;color:#fff;
    border:none;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer;margin-top:8px;
  }
  .back-link{margin-top:18px;font-size:14px;color:#100ab6;cursor:pointer}
</style>
</head>
<body>

  <div id="splash">
    <div class="center">
      <div class="logo-wrap">
        <img src="logo.png" alt="DankConnect">
      </div>
      <h1>DANKCONNECT</h1>
      <div class="sub">EMPOWERED BY DANKAN EMPIRE</div>
      <div class="btn-outer">
        <button class="btn-inner" onclick="showAuth()">CREATE ACCOUNT</button>
      </div>
    </div>
  </div>

  <div id="auth">
    <div class="auth-card">
      <h2>Create Account</h2>
      <p>Join DankConnect securely</p>
      <input type="text" id="name" placeholder="Full Name">
      <input type="tel" id="phone" placeholder="Phone Number">
      <input type="password" id="pass" placeholder="Password">
      <button class="auth-btn" onclick="createAccount()">Create Account</button>
      <div class="back-link" onclick="showSplash()">← Back</div>
    </div>
  </div>

<script>
  function showAuth(){
    document.getElementById('splash').classList.add('hidden');
    document.getElementById('auth').classList.add('show');
  }
  function showSplash(){
    document.getElementById('auth').classList.remove('show');
    document.getElementById('splash').classList.remove('hidden');
  }
  function createAccount(){
    const n = document.getElementById('name').value.trim();
    const p = document.getElementById('phone').value.trim();
    if(!n || !p){ alert('Please enter name and phone'); return; }
    alert('Account created for ' + n);
  }
</script>
</body>
</html>
