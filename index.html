<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>DANKCONNECT</title>
<meta name="theme-color" content="#0d00b3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DANKCONNECT">
<link rel="apple-touch-icon" href="logo.png">
<link rel="icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial}
:root{--blue:#0d00b3;--green:#00d166}
body{background:#efeeff;height:100dvh;overflow:hidden}
#loginView{height:100dvh;background:var(--blue);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;color:white}
.login-logo{width:110px;height:110px;border-radius:28px;background:white;padding:6px;object-fit:cover}
.login-box{background:white;width:100%;max-width:380px;border-radius:24px;padding:22px;margin-top:22px;color:#111}
.login-box input{width:100%;padding:15px;border-radius:12px;border:1.5px solid #d1d5db;font-size:16px;margin-bottom:12px}
.btn-primary{width:100%;padding:15px;background:var(--blue);color:white;border:none;border-radius:12px;font-weight:800;font-size:16px}
#loginMsg{text-align:center;margin-top:10px;font-size:13px;font-weight:700;min-height:18px;color:#d00}
#mainView{display:none;height:100dvh;flex-direction:column;background:#0a0a14;color:white}
.m-top{padding:14px 16px 8px;display:flex;justify-content:space-between;align-items:center;background:var(--blue);padding-top:calc(14px + env(safe-area-inset-top))}
.m-top h1{font-size:32px;font-weight:900;letter-spacing:-0.5px}
.icon-btn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px}
.search-wrap{padding:10px 14px;background:var(--blue);padding-bottom:14px}
.sbox{background:rgba(0,0,0,0.28);border-radius:12px;display:flex;align-items:center;padding:10px 14px;gap:10px}
.sbox input{flex:1;background:transparent;border:none;color:white;font-size:15px;outline:none}
.sbox input::placeholder{color:rgba(255,255,255,0.6)}
.filter-chips{display:flex;gap:8px;padding:10px 14px;overflow-x:auto;background:#0a0a14}
.chip{white-space:nowrap;padding:8px 14px;border-radius:20px;background:#23233a;color:#9a9ab3;font-size:13px;font-weight:600;cursor:pointer}
.chip.active{background:white;color:#0a0a14;font-weight:800}
.list{flex:1;overflow-y:auto;background:#0a0a14;padding-bottom:90px}
.chat-row{display:flex;gap:12px;padding:12px 14px;cursor:pointer;align-items:center;border-bottom:1px solid rgba(255,255,255,0.06)}
.av{width:52px;height:52px;border-radius:50%;background:var(--blue);color:white;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;overflow:hidden;flex-shrink:0}
.av img{width:100%;height:100%;object-fit:cover}
.chat-info{flex:1;min-width:0}
.chat-top{display:flex;justify-content:space-between;align-items:center}
.chat-name{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:white}
.chat-time{font-size:12px;color:#8b8ba7;flex-shrink:0;margin-left:8px}
.chat-time.green{color:var(--green);font-weight:800}
.chat-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.chat-last{font-size:14px;color:#8b8ba7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.badge{background:var(--green);color:#0a0a14;border-radius:50%;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;padding:0 6px;margin-left:8px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#14142a;border-top:1px solid rgba(255,255,255,0.08);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;color:#6b6b8a;font-size:10px;cursor:pointer}
.nav-item.active{color:white}
#chatView{display:none;height:100dvh;flex-direction:column;background:#0f0f23}
.chat-head{background:var(--blue);color:white;padding:10px 12px;display:flex;align-items:center;gap:10px;padding-top:calc(10px + env(safe-area-inset-top))}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:#0a0a14}
.bubble{max-width:78%;padding:10px 12px;border-radius:18px;font-size:14.5px;word-break:break-word}
.bubble.me{align-self:flex-end;background:var(--blue);color:white;border-bottom-right-radius:4px}
.bubble.other{align-self:flex-start;background:#1e1e35;color:white;border-bottom-left-radius:4px}
.input-bar{display:flex;gap:8px;padding:10px;background:#14142a;align-items:center;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.input-bar input{flex:1;padding:12px 16px;border-radius:25px;border:none;background:#23233a;color:white;outline:none}
</style>
</head>
<body>
<div id="loginView"><img src="logo.png" class="login-logo"><h2 style="margin-top:16px;font-weight:900">DANKCONNECT</h2><p style="font-size:13px;opacity:0.9;text-align:center;margin-top:6px">Ghana's Secure Chat 🇬🇭<br>Username only • Text only • Free</p><div class="login-box"><input id="username" placeholder="Username e.g. dankboy"><input id="password" type="password" placeholder="Password min 6 chars"><button id="loginBtn" class="btn-primary">LOGIN / CREATE ACCOUNT</button><div id="loginMsg"></div></div></div>
<div id="mainView"><div class="m-top"><h1>Chats</h1><div style="display:flex;gap:8px"><div class="icon-btn">📷</div><div class="icon-btn" onclick="newPrivateChat()" style="background:white;color:#0d00b3;font-weight:900;font-size:24px">+</div></div></div><div class="search-wrap"><div class="sbox"><span>🔍</span><input id="searchInput" placeholder="Search" oninput="filterChats()"></div></div><div class="filter-chips"><div class="chip active" id="chipAll" onclick="switchTab('all')">All</div><div class="chip" id="chipChats" onclick="switchTab('chats')">Unread <span id="unreadCount">0</span></div><div class="chip">Favorites</div><div class="chip" id="chipGroups" onclick="switchTab('groups')">Groups <span id="groupCount">0</span></div><div class="chip" onclick="createGroup()">+</div></div><div class="list" id="chatList"></div><div class="bottom-nav"><div class="nav-item"><span>⭕</span>Updates</div><div class="nav-item"><span>📞</span>Calls</div><div class="nav-item"><span>🛠️</span>Tools</div><div class="nav-item active"><span>💬</span>Chats</div><div class="nav-item" onclick="if(confirm('Logout?')) doLogout()"><span>⚙️</span>Settings</div></div></div>
<div id="chatView"><div class="chat-head"><div onclick="closeChat()" style="font-size:28px;cursor:pointer">‹</div><div class="av" id="chatAv">DC</div><div style="flex:1"><div style="font-weight:800" id="chatName">Chat</div><div style="font-size:11px;opacity:0.8">online • text only</div></div><div>📞</div><div style="margin-left:12px">🎥</div></div><div class="msgs" id="msgs"></div><div class="input-bar"><input type="text" id="msgInput" placeholder="Type message..." onkeydown="if(event.key==='Enter') sendMsg()"><button onclick="sendMsg()" style="width:42px;height:42px;border-radius:50%;background:#0d00b3;color:white;border:none">➤</button></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, addDoc, query, onSnapshot, orderBy, serverTimestamp, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyDfWReJ-A4J2W5V_FahYjLwfXv3-sNvXZE", authDomain: "dankconnect.firebaseapp.com", projectId: "dankconnect", storageBucket: "dankconnect.firebasestorage.app", messagingSenderId: "248906319926", appId: "1:248906319926:web:704456ec90628c5f2a7097" };
const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);
await setPersistence(auth, browserLocalPersistence);
let currentUsername=null,currentChatId=null,currentChatType='private',currentTab='all',unsubMsgs=null,unsubPriv=null,unsubGroup=null,cachePrivate=[],cacheGroups=[];
function cleanU(u){return u.trim().toLowerCase().replace(/[^a-z0-9_]/g,'').slice(0,20)}
function emailFromU(u){return cleanU(u)+"@dankconnect.app"}
async function handleLogin(){let u=cleanU(document.getElementById('username').value),p=document.getElementById('password').value.trim(),msgEl=document.getElementById('loginMsg');if(u.length<3){msgEl.textContent="Username min 3";return}if(p.length<6){msgEl.textContent="Password min 6";return}document.getElementById('loginBtn').disabled=true;msgEl.textContent="Checking...";let email=emailFromU(u);try{await signInWithEmailAndPassword(auth,email,p);msgEl.style.color="#00ff88";msgEl.textContent="Welcome "+u}catch(err){if(err.code==='auth/invalid-credential'||err.code==='auth/user-not-found'){try{let cred=await createUserWithEmailAndPassword(auth,email,p);await setDoc(doc(db,"users",cred.user.uid),{username:u,created:serverTimestamp()},{merge:true});await setDoc(doc(db,"usernames",u),{uid:cred.user.uid,username:u},{merge:true});msgEl.style.color="#00ff88";msgEl.textContent="Created "+u}catch(cErr){msgEl.textContent=cErr.message}}else{msgEl.textContent=err.message}}document.getElementById('loginBtn').disabled=false}
document.getElementById('loginBtn').addEventListener('click',handleLogin);
onAuthStateChanged(auth,(user)=>{if(user){let uname=cleanU(user.email.split('@')[0]);currentUsername=uname;localStorage.setItem('dc_user',uname);document.getElementById('loginView').style.display='none';document.getElementById('mainView').style.display='flex';listenAllChats()}else{currentUsername=null;document.getElementById('loginView').style.display='flex';document.getElementById('mainView').style.display='none';document.getElementById('chatView').style.display='none';let s=localStorage.getItem('dc_user');if(s)document.getElementById('username').value=s;if(unsubMsgs)unsubMsgs();if(unsubPriv)unsubPriv();if(unsubGroup)unsubGroup()}});
function getPrivateChatId(a,b){a=cleanU(a);b=cleanU(b);if(a===b)return null;return "private_"+[a,b].sort().join("_")}
function listenAllChats(){
if(unsubPriv)unsubPriv(); if(unsubGroup)unsubGroup();
// FIXED - NO ORDERBY - NO INDEX NEEDED - PRIVATE CHATS WILL SHOW!
let qPrivate=query(collection(db,"private_chats"),where("participants","array-contains",currentUsername));
let qGroups=query(collection(db,"group_chats"),where("members","array-contains",currentUsername));
unsubPriv=onSnapshot(qPrivate,(snap)=>{cachePrivate=snap.docs.map(d=>({id:d.id,type:'private',...d.data()}));renderList()});
unsubGroup=onSnapshot(qGroups,(snap)=>{cacheGroups=snap.docs.map(d=>({id:d.id,type:'group',...d.data()}));renderList()});
}
function renderList(){
let list=document.getElementById('chatList');list.innerHTML='';
let q=document.getElementById('searchInput').value.toLowerCase();
let all=[...cachePrivate,...cacheGroups].sort((a,b)=>(b.lastTime?.seconds||0)-(a.lastTime?.seconds||0));
let filtered=all.filter(c=>{
if(currentTab==='groups'&&c.type!=='group')return false;
if(currentTab==='chats'&&c.type!=='private')return false;
if(!q)return true;
if(c.type==='private'){let o=(c.participants||[]).find(p=>p!==currentUsername)||'';return o.includes(q)}
else return (c.name||'').toLowerCase().includes(q)
});
document.getElementById('unreadCount').textContent=cachePrivate.length;
document.getElementById('groupCount').textContent=cacheGroups.length;
let arch=document.createElement('div');arch.className='chat-row';
arch.innerHTML=`<div style="width:52px;height:52px;border-radius:50%;background:#1e1e35;display:flex;align-items:center;justify-content:center">🗃️</div><div class="chat-info"><div class="chat-top"><span class="chat-name" style="color:#8b8ba7">Archived</span></div></div>`;
list.appendChild(arch);
let official=document.createElement('div');official.className='chat-row';
official.style.borderBottom="1px solid rgba(255,255,255,0.15)";
official.innerHTML=`<div class="av" style="background:#0d00b3"><img src="logo.png" style="width:100%;height:100%;object-fit:cover"></div><div class="chat-info"><div class="chat-top"><span class="chat-name">Business assistant</span><span class="chat-time">08:47</span></div><div class="chat-bottom"><span class="chat-last">Draft: Ohk so now some little mor...</span></div></div>`;
official.onclick=()=>openGeneral();
list.appendChild(official);
filtered.forEach(c=>{
let row=document.createElement('div');row.className='chat-row';
let timeStr=c.lastTime?new Date(c.lastTime.seconds*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'08:46';
if(c.type==='private'){
let other=(c.participants||[]).find(p=>p!==currentUsername)||'Unknown';
row.innerHTML=`<div class="av">${other.slice(0,2).toUpperCase()}</div><div class="chat-info"><div class="chat-top"><span class="chat-name">${other} ❤️</span><span class="chat-time green">${timeStr}</span></div><div class="chat-bottom"><span class="chat-last">${c.lastMsg||'Hm'}</span><span class="badge">4</span></div></div>`;
row.onclick=()=>openPrivate(other);
}else{
row.innerHTML=`<div class="av" style="background:#5b5bff">${c.name?.slice(0,2).toUpperCase()}</div><div class="chat-info"><div class="chat-top"><span class="chat-name">${c.name} ❤️</span><span class="chat-time">${timeStr}</span></div><div class="chat-bottom"><span class="chat-last">${c.lastMsg||'Group'} • ${c.members?.length||0} members</span></div></div>`;
row.onclick=()=>openGroup(c.id,c.name);
}
list.appendChild(row);
});
if(filtered.length===0){
let empty=document.createElement('div');empty.style="text-align:center;padding:24px;color:#6b6b8a;font-size:13px";
empty.innerHTML=`No private chats yet<br>Private chats will appear here below Business assistant<br><br><button onclick="newPrivateChat()" style="padding:12px 20px;background:#0d00b3;color:white;border:none;border-radius:12px;font-weight:800">+ Start Private Chat</button>`;
list.appendChild(empty);
}
}
window.switchTab=(t)=>{currentTab=t;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));let map={all:'chipAll',chats:'chipChats',groups:'chipGroups'};if(map[t])document.getElementById(map[t]).classList.add('active');renderList()}
window.filterChats=()=>renderList();
window.newPrivateChat=async()=>{let o=prompt("Enter username:");if(!o)return;o=cleanU(o);if(!o||o===currentUsername){alert("Invalid");return}openPrivate(o)};
window.createGroup=async()=>{let name=prompt("Group name:");if(!name)return;name=name.trim().slice(0,30);let membersRaw=prompt("Members comma separated:");let members=membersRaw?membersRaw.split(',').map(cleanU).filter(Boolean):[];members=[...new Set([currentUsername,...members])];let id="group_"+Date.now()+"_"+cleanU(name);await setDoc(doc(db,"group_chats",id),{name:name,members:members,createdBy:currentUsername,createdAt:serverTimestamp(),lastMsg:"Group created",lastTime:serverTimestamp()});openGroup(id,name)};
function openPrivate(other){currentChatType='private';currentChatId=getPrivateChatId(currentUsername,other);document.getElementById('chatName').textContent=other;document.getElementById('chatAv').textContent=other.slice(0,2).toUpperCase();showChat();setDoc(doc(db,"private_chats",currentChatId),{participants:[currentUsername,other].sort(),lastTime:serverTimestamp()},{merge:true});listenMessages()}
window.openGeneral=()=>{currentChatType='general';currentChatId='general';document.getElementById('chatName').textContent='Business assistant';document.getElementById('chatAv').innerHTML='<img src="logo.png" style="width:100%;height:100%;object-fit:cover">';showChat();listenMessages()};
function openGroup(id,name){currentChatType='group';currentChatId=id;document.getElementById('chatName').textContent=name;document.getElementById('chatAv').textContent=name.slice(0,2).toUpperCase();showChat();listenMessages()}
window.openGroup=openGroup;window.openPrivate=openPrivate;
function showChat(){document.getElementById('mainView').style.display='none';document.getElementById('chatView').style.display='flex'}
window.closeChat=()=>{if(unsubMsgs)unsubMsgs();document.getElementById('chatView').style.display='none';document.getElementById('mainView').style.display='flex';currentChatId=null};
function listenMessages(){if(unsubMsgs)unsubMsgs();let box=document.getElementById('msgs');box.innerHTML='Loading...';let col;if(currentChatType==='private')col=collection(db,"private_chats",currentChatId,"messages");else if(currentChatType==='group')col=collection(db,"group_chats",currentChatId,"messages");else col=collection(db,"messages");let q=query(col,orderBy("time","asc"));unsubMsgs=onSnapshot(q,(snap)=>{box.innerHTML='';snap.forEach(d=>{let data=d.data();let div=document.createElement('div');let isMe=data.sender===currentUsername||data.uid===auth.currentUser?.uid;div.className='bubble '+(isMe?'me':'other');div.textContent=data.text;box.appendChild(div)});box.scrollTop=box.scrollHeight})}
window.sendMsg=async()=>{let txt=document.getElementById('msgInput').value.trim();if(!txt||!currentChatId)return;document.getElementById('msgInput').value='';let col;if(currentChatType==='private')col=collection(db,"private_chats",currentChatId,"messages");else if(currentChatType==='group')col=collection(db,"group_chats",currentChatId,"messages");else col=collection(db,"messages");await addDoc(col,{text:txt,sender:currentUsername,uid:auth.currentUser.uid,time:serverTimestamp(),type:'text'});if(currentChatType==='private')await setDoc(doc(db,"private_chats",currentChatId),{lastMsg:txt,lastTime:serverTimestamp(),participants:[currentUsername,...currentChatId.replace('private_','').split('_').filter(u=>u!==currentUsername)]},{merge:true});if(currentChatType==='group')await setDoc(doc(db,"group_chats",currentChatId),{lastMsg:currentUsername+": "+txt.slice(0,40),lastTime:serverTimestamp()},{merge:true})};
window.doLogout=()=>signOut(auth);
</script>
</body>
</html>
