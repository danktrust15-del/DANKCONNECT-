<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>DANKCONNECT</title>
<meta name="theme-color" content="#0d00b3">
<link rel="icon" href="logo.png"><link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial}
:root{--blue:#0d00b3}
body{background:#efeeff;height:100dvh;overflow:hidden}
#loginView{height:100dvh;background:var(--blue);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;color:white}
.login-logo{width:110px;height:110px;border-radius:28px;background:white;padding:6px;object-fit:cover}
.login-box{background:white;width:100%;max-width:380px;border-radius:24px;padding:22px;margin-top:22px;color:#111}
.login-box input{width:100%;padding:15px;border-radius:12px;border:1.5px solid #d1d5db;font-size:16px;margin-bottom:12px}
.btn-primary{width:100%;padding:15px;background:var(--blue);color:white;border:none;border-radius:12px;font-weight:800;font-size:16px}
#loginMsg{text-align:center;margin-top:10px;font-size:13px;font-weight:700;min-height:18px;color:#ffeb3b}
#mainView{display:none;height:100dvh;flex-direction:column;background:#0a0a14;color:white}
.m-top{padding:14px 16px 8px;display:flex;justify-content:space-between;align-items:center;background:var(--blue);padding-top:calc(14px + env(safe-area-inset-top))}
.m-top h1{font-size:32px;font-weight:900}
.icon-btn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
.my-av{width:38px;height:38px;border-radius:50%;object-fit:cover;background:white}
.search-wrap{padding:10px 14px;background:var(--blue);padding-bottom:14px}
.sbox{background:rgba(0,0,0,0.28);border-radius:12px;display:flex;align-items:center;padding:10px 14px;gap:10px}
.sbox input{flex:1;background:transparent;border:none;color:white;font-size:15px;outline:none}
.filter-chips{display:flex;gap:8px;padding:10px 14px;overflow-x:auto;background:#0a0a14}
.chip{white-space:nowrap;padding:8px 14px;border-radius:20px;background:#23233a;color:#9a9ab3;font-size:13px;font-weight:600;cursor:pointer}
.chip.active{background:white;color:#0a0a14;font-weight:800}
.list{flex:1;overflow-y:auto;background:#0a0a14;padding-bottom:90px}
.chat-row{display:flex;gap:12px;padding:12px 14px;cursor:pointer;align-items:center;border-bottom:1px solid rgba(255,255,255,0.06)}
.av{width:52px;height:52px;border-radius:50%;background:var(--blue);color:white;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;overflow:hidden;flex-shrink:0}
.av img{width:100%;height:100%;object-fit:cover}
.chat-info{flex:1;min-width:0}
.chat-top{display:flex;justify-content:space-between;align-items:center}
.chat-name{font-weight:700;font-size:16px;color:white}
.chat-time{font-size:12px;color:#8b8ba7;margin-left:8px}
.chat-time.green{color:var(--blue);font-weight:800}
.chat-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.chat-last{font-size:14px;color:#8b8ba7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.badge{background:var(--blue);color:white;border-radius:50%;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;padding:0 6px;margin-left:8px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#14142a;border-top:1px solid rgba(255,255,255,0.08);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;color:#6b6b8a;font-size:10px;cursor:pointer}
.nav-item.active{color:white}
#chatView{display:none;height:100dvh;flex-direction:column;background:#0f0f23}
.chat-head{background:var(--blue);color:white;padding:10px 12px;display:flex;align-items:center;gap:10px;padding-top:calc(10px + env(safe-area-inset-top))}
.chat-head.av{width:38px;height:38px;font-size:14px}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:#0a0a14}
.bubble{max-width:78%;padding:10px 12px;border-radius:18px;font-size:14.5px;word-break:break-word;cursor:pointer;position:relative}
.bubble.me{align-self:flex-end;background:var(--blue);color:white;border-bottom-right-radius:4px}
.bubble.other{align-self:flex-start;background:#1e1e35;color:white;border-bottom-left-radius:4px}
.bubble.image-bubble{padding:4px;border-radius:12px;overflow:hidden}
.bubble.image-bubble img{max-width:220px;max-height:260px;border-radius:10px;display:block;cursor:pointer}
.input-bar{display:flex;gap:6px;padding:10px;background:#14142a;align-items:center;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.input-bar input{flex:1;padding:12px 16px;border-radius:25px;border:none;background:#23233a;color:white;outline:none}
#typingIndicator{display:none;padding:6px 18px;font-size:13px;color:#8ab4ff;font-weight:700;background:#0a0a14}
.voice-bubble{display:flex;align-items:center;gap:10px;min-width:180px}
.voice-play{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;flex-shrink:0}
.voice-wave{flex:1;height:28px;display:flex;align-items:center;gap:2px}
.voice-wave-bar{width:3px;background:rgba(255,255,255,0.5);border-radius:2px}
.voice-duration{font-size:12px;font-weight:800}
.recording-bar{display:none;flex:1;background:#23233a;border-radius:25px;padding:10px 16px;align-items:center;gap:10px;color:white}
.recording-bar.active{display:flex}
.rec-dot{width:10px;height:10px;border-radius:50%;background:#ff3b30;animation:blink 1s infinite}
.rec-timer{font-weight:800;color:#ff3b30;font-size:14px}
@keyframes blink{0%{opacity:0.2}50%{opacity:1}100%{opacity:0.2}}
#micBtn,#sendBtn,#imgBtn{width:42px;height:42px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;flex-shrink:0}
#micBtn{background:var(--blue);color:white}
#imgBtn{background:#23233a;color:white}
#sendBtn{background:var(--blue);color:white;display:none}
#micBtn.recording{background:#ff3b30;animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
.profile-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:9999;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.profile-modal.active{display:flex}
.profile-modal-img{width:280px;height:280px;border-radius:50%;object-fit:cover;border:4px solid white;max-width:80vw;max-height:50vh}
.profile-modal-name{margin-top:18px;font-size:24px;font-weight:900;color:white}
.profile-modal-user{margin-top:6px;color:#9a9ab3;font-size:14px}
.profile-modal-actions{display:flex;gap:12px;margin-top:22px}
.profile-modal-btn{padding:12px 20px;border-radius:25px;border:none;font-weight:800;cursor:pointer}
.profile-modal-btn.primary{background:#0d00b3;color:white}
.profile-modal-btn.secondary{background:#23233a;color:white}
.profile-modal-close{position:absolute;top:20px;left:20px;font-size:32px;color:white;cursor:pointer}
</style>
</head>
<body>
<div id="loginView"><img src="logo.png" class="login-logo"><h2 style="margin-top:16px;font-weight:900">DANKCONNECT</h2><div class="login-box"><input id="username" placeholder="Username e.g. dankboy"><input id="password" type="password" placeholder="Password"><button id="loginBtn" class="btn-primary">LOGIN / CREATE</button><div id="loginMsg"></div></div></div>
<div id="mainView"><div class="m-top"><h1>Chats</h1><div style="display:flex;gap:8px"><div class="icon-btn" id="myProfileBtn" onclick="openProfileModal(event, currentUsername)"><img id="myAvImg" class="my-av" style="display:none"><span id="myAvTxt">ME</span></div><div class="icon-btn" id="themeBtn" onclick="toggleTheme()">🌙</div><div class="icon-btn" onclick="newPrivateChat()" style="background:white;color:#0d00b3;font-weight:900;font-size:24px">+</div></div></div><div class="search-wrap"><div class="sbox"><span>🔍</span><input id="searchInput" placeholder="Search" oninput="filterChats()"></div></div><div class="filter-chips"><div class="chip active" id="chipAll" onclick="switchTab('all')">All</div><div class="chip" id="chipChats" onclick="switchTab('chats')">Unread <span id="unreadCount">0</span></div><div class="chip" id="chipGroups" onclick="switchTab('groups')">Groups <span id="groupCount">0</span></div><div class="chip" onclick="createGroup()">+</div></div><div class="list" id="chatList"></div><div class="bottom-nav"><div class="nav-item active"><span>💬</span>Chats</div><div class="nav-item" onclick="if(confirm('Logout?')) doLogout()"><span>⚙️</span>Settings</div></div></div>
<div id="chatView"><div class="chat-head"><div onclick="closeChat()" style="font-size:28px;cursor:pointer">‹</div><div class="av" id="chatAv">DC</div><div style="flex:1"><div style="font-weight:800" id="chatName">Chat</div><div style="font-size:11px;opacity:0.8" id="chatStatus">online • tap 📎 for image</div></div></div><div class="msgs" id="msgs"></div><div id="typingIndicator">typing...</div>
<div class="input-bar">
<button id="imgBtn" onclick="document.getElementById('imageInput').click()">📎</button>
<input type="text" id="msgInput" placeholder="Type message...">
<div class="recording-bar" id="recordingBar"><div class="rec-dot"></div><span class="rec-timer" id="recTimer">0:00</span><span>recording...</span></div>
<button id="micBtn">🎤</button><button id="sendBtn" onclick="sendMsg()">➤</button>
</div></div>
<input type="file" id="profileInput" accept="image/*" style="display:none">
<input type="file" id="imageInput" accept="image/*" style="display:none">
<div id="profileModal" class="profile-modal" onclick="if(event.target.id==='profileModal') closeProfileModal()">
<div class="profile-modal-close" onclick="closeProfileModal()">‹</div>
<img id="profileModalImg" class="profile-modal-img" src="">
<div id="profileModalName" class="profile-modal-name"></div>
<div id="profileModalUser" class="profile-modal-user"></div>
<div class="profile-modal-actions" id="profileModalActions">
<button class="profile-modal-btn primary" onclick="openChatFromModal()">Message</button>
<button class="profile-modal-btn secondary" onclick="closeProfileModal()">Close</button>
</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, addDoc, query, onSnapshot, orderBy, serverTimestamp, where, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyDfWReJ-A4J2W5V_FahYjLwfXv3-sNvXZE", authDomain: "dankconnect.firebaseapp.com", projectId: "dankconnect", storageBucket: "dankconnect.firebasestorage.app", messagingSenderId: "248906319926", appId: "1:248906319926:web:704456ec90628c5f2a7097" };
const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);
await setPersistence(auth, browserLocalPersistence);
function applyTheme(t){ if(t==='light'){document.body.classList.add('light-mode');localStorage.setItem('dc_theme','light');let b=document.getElementById('themeBtn');if(b)b.textContent='☀️';} else{document.body.classList.remove('light-mode');localStorage.setItem('dc_theme','dark');let b=document.getElementById('themeBtn');if(b)b.textContent='🌙';}}
window.toggleTheme=()=>{let cur=document.body.classList.contains('light-mode')?'light':'dark';applyTheme(cur==='light'?'dark':'light')};
(function(){let saved=localStorage.getItem('dc_theme');if(saved){applyTheme(saved);}else{applyTheme('dark');}})();
let currentUsername=null,currentChatId=null,currentChatType='private',currentChatOther=null,currentTab='all',unsubMsgs=null,unsubPriv=null,unsubGroup=null,unsubChatMeta=null,unsubProfiles=null,cachePrivate=[],cacheGroups=[],typingTimeout=null;
let mediaRecorder=null, audioChunks=[], isRecording=false, recStartTime=0, recTimerInterval=null, currentAudio=null, currentPlayingId=null;
let profilesCache={};
const MAX_DURATION = 30;
function cleanU(u){return u.trim().toLowerCase().replace(/[^a-z0-9_]/g,'').slice(0,20)}
function emailFromU(u){return cleanU(u)+"@dankconnect.app"}
function formatTime(sec){let m=Math.floor(sec/60), s=Math.floor(sec%60); return `${m}:${s.toString().padStart(2,'0')}`}
function compressImage(file,maxSize=200,quality=0.6){return new Promise((res,rej)=>{let img=new Image();let reader=new FileReader();reader.onload=e=>{img.src=e.target.result};img.onload=()=>{let canvas=document.createElement('canvas');let w=img.width,h=img.height;if(w>h){if(w>maxSize){h*=maxSize/w;w=maxSize}}else{if(h>maxSize){w*=maxSize/h;h=maxSize}}canvas.width=w;canvas.height=h;let ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);let base64=canvas.toDataURL('image/jpeg',quality).split(',')[1];res(base64)};img.onerror=rej;reader.onerror=rej;reader.readAsDataURL(file)});}
async function handleLogin(){let u=cleanU(document.getElementById('username').value),p=document.getElementById('password').value.trim(),msgEl=document.getElementById('loginMsg');if(u.length<3){msgEl.textContent="Username min 3";return}if(p.length<6){msgEl.textContent="Password min 6";return}document.getElementById('loginBtn').disabled=true;msgEl.textContent="Checking...";let email=emailFromU(u);try{await signInWithEmailAndPassword(auth,email,p);msgEl.style.color="#00ff88";msgEl.textContent="Welcome "+u}catch(err){if(err.code==='auth/invalid-credential'||err.code==='auth/user-not-found'){try{let cred=await createUserWithEmailAndPassword(auth,email,p);await setDoc(doc(db,"users",cred.user.uid),{username:u,created:serverTimestamp()},{merge:true});await setDoc(doc(db,"usernames",u),{uid:cred.user.uid,username:u},{merge:true});msgEl.style.color="#00ff88";msgEl.textContent="Created "+u}catch(cErr){msgEl.textContent=cErr.message}}else{msgEl.textContent=err.message}}document.getElementById('loginBtn').disabled=false}
document.getElementById('loginBtn').addEventListener('click',handleLogin);
onAuthStateChanged(auth,(user)=>{if(user){let uname=cleanU(user.email.split('@')[0]);currentUsername=uname;localStorage.setItem('dc_user',uname);document.getElementById('loginView').style.display='none';document.getElementById('mainView').style.display='flex';listenAllChats();listenProfiles();loadMyProfile()}else{currentUsername=null;document.getElementById('loginView').style.display='flex';document.getElementById('mainView').style.display='none';document.getElementById('chatView').style.display='none';if(unsubMsgs)unsubMsgs();if(unsubPriv)unsubPriv();if(unsubGroup)unsubGroup();if(unsubChatMeta)unsubChatMeta();if(unsubProfiles)unsubProfiles()}});
function getPrivateChatId(a,b){a=cleanU(a);b=cleanU(b);if(a===b)return null;return "private_"+[a,b].sort().join("_")}
function listenAllChats(){if(unsubPriv)unsubPriv(); if(unsubGroup)unsubGroup();let qPrivate=query(collection(db,"private_chats"),where("participants","array-contains",currentUsername));let qGroups=query(collection(db,"group_chats"),where("members","array-contains",currentUsername));unsubPriv=onSnapshot(qPrivate,(snap)=>{cachePrivate=snap.docs.map(d=>({id:d.id,type:'private',...d.data()}));renderList()});unsubGroup=onSnapshot(qGroups,(snap)=>{cacheGroups=snap.docs.map(d=>({id:d.id,type:'group',...d.data()}));renderList()});}
function listenProfiles(){if(unsubProfiles)unsubProfiles();let qProf=collection(db,"user_profiles");unsubProfiles=onSnapshot(qProf,(snap)=>{profilesCache={};snap.forEach(d=>{profilesCache[d.id]=d.data()});renderList();if(currentChatId&&currentChatType==='private') updateChatHeaderPic();let my=profilesCache[currentUsername];if(my&&my.photo){document.getElementById('myAvImg').src='data:image/jpeg;base64,'+my.photo;document.getElementById('myAvImg').style.display='block';document.getElementById('myAvTxt').style.display='none';}});}
async function loadMyProfile(){try{let d=await getDoc(doc(db,"user_profiles",currentUsername));if(d.exists()&&d.data().photo){document.getElementById('myAvImg').src='data:image/jpeg;base64,'+d.data().photo;document.getElementById('myAvImg').style.display='block';document.getElementById('myAvTxt').style.display='none';}}catch(e){}}
function getUnreadCount(c){if(!c) return 0;if(c.unread && typeof c.unread === 'object' && c.unread[currentUsername]!== undefined){return c.unread[currentUsername] || 0;}return 0;}
function renderList(){let list=document.getElementById('chatList');list.innerHTML='';let q=document.getElementById('searchInput').value.toLowerCase();let all=[...cachePrivate,...cacheGroups].sort((a,b)=>(b.lastTime?.seconds||0)-(a.lastTime?.seconds||0));let filtered=all.filter(c=>{if(currentTab==='groups'&&c.type!=='group')return false;if(currentTab==='chats'){let unread=getUnreadCount(c);if(unread===0) return false;}if(!q)return true;if(c.type==='private'){let o=(c.participants||[]).find(p=>p!==currentUsername)||'';return o.includes(q)}else return (c.name||'').toLowerCase().includes(q)});document.getElementById('unreadCount').textContent=cachePrivate.filter(c=>getUnreadCount(c)>0).length;document.getElementById('groupCount').textContent=cacheGroups.length;filtered.forEach(c=>{let row=document.createElement('div');row.className='chat-row';let timeStr=c.lastTime?new Date(c.lastTime.seconds*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';let isTyping=c.typing && Object.keys(c.typing).some(u=>u!==currentUsername && c.typing[u]);let lastText=isTyping?`<span style="color:#8ab4ff;font-weight:700">typing...</span>`:(c.lastMsg||'');if(c.type==='private'){let other=(c.participants||[]).find(p=>p!==currentUsername)||'Unknown';let unread=getUnreadCount(c);let timeCls=unread>0?"chat-time green":"chat-time";let badge=unread>0?`<span class="badge">${unread>9?'9+':unread}</span>`:"";let prof=profilesCache[other];let avHtml=prof&&prof.photo?`<div class="av" onclick="openProfileModal(event,'${other}')"><img src="data:image/jpeg;base64,${prof.photo}"></div>`:`<div class="av" onclick="openProfileModal(event,'${other}')">${other.slice(0,2).toUpperCase()}</div>`;row.innerHTML=`${avHtml}<div class="chat-info"><div class="chat-top"><span class="chat-name">${other}</span><span class="${timeCls}">${timeStr}</span></div><div class="chat-bottom"><span class="chat-last">${lastText}</span>${badge}</div></div>`;row.onclick=()=>openPrivate(other);}else{let unread=getUnreadCount(c);let timeCls=unread>0?"chat-time green":"chat-time";let badge=unread>0?`<span class="badge">${unread>9?'9+':unread}</span>`:"";row.innerHTML=`<div class="av" style="background:#5b5bff">${c.name?.slice(0,2).toUpperCase()}</div><div class="chat-info"><div class="chat-top"><span class="chat-name">${c.name}</span><span class="${timeCls}">${timeStr}</span></div><div class="chat-bottom"><span class="chat-last">${lastText}</span>${badge}</div></div>`;row.onclick=()=>openGroup(c.id,c.name);}list.appendChild(row);});}
window.switchTab=(t)=>{currentTab=t;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));let map={all:'chipAll',chats:'chipChats',groups:'chipGroups'};if(map[t])document.getElementById(map[t]).classList.add('active');renderList()}
window.filterChats=()=>renderList();
window.newPrivateChat=async()=>{let o=prompt("Enter username:");if(!o)return;o=cleanU(o);if(!o||o===currentUsername){alert("Invalid");return}openPrivate(o)};
window.createGroup=async()=>{let name=prompt("Group name:");if(!name)return;name=name.trim().slice(0,30);let membersRaw=prompt("Members comma separated:");let members=membersRaw?membersRaw.split(',').map(cleanU).filter(Boolean):[];members=[...new Set([currentUsername,...members])];let id="group_"+Date.now()+"_"+cleanU(name);await setDoc(doc(db,"group_chats",id),{name:name,members:members,createdBy:currentUsername,createdAt:serverTimestamp(),lastMsg:"Group created",lastTime:serverTimestamp()});openGroup(id,name)};
function updateChatHeaderPic(){if(currentChatType!=='private') return;let other=currentChatOther;let prof=profilesCache[other];let avEl=document.getElementById('chatAv');avEl.onclick=(e)=>openProfileModal(e,other); if(prof&&prof.photo){avEl.innerHTML=`<img src="data:image/jpeg;base64,${prof.photo}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;}else{avEl.textContent=other.slice(0,2).toUpperCase();}}
async function openPrivate(other){currentChatOther=other;currentChatType='private';currentChatId=getPrivateChatId(currentUsername,other);document.getElementById('chatName').textContent=other;updateChatHeaderPic();showChat();try{let existing=cachePrivate.find(c=>c.id===currentChatId);let otherUnread=existing?.unread?.[other]||0;await setDoc(doc(db,"private_chats",currentChatId),{participants:[currentUsername,other].sort(),lastTime:serverTimestamp(),unread:{[currentUsername]:0,[other]:otherUnread}},{merge:true});}catch(e){}listenMessages()}
async function openGroup(id,name){currentChatType='group';currentChatId=id;currentChatOther=null;document.getElementById('chatName').textContent=name;document.getElementById('chatAv').textContent=name.slice(0,2).toUpperCase();showChat();try{let existing=cacheGroups.find(c=>c.id===id);let unreadMap={};if(existing?.unread){Object.keys(existing.unread).forEach(k=>{unreadMap[k]=existing.unread[k]});}unreadMap[currentUsername]=0;await setDoc(doc(db,"group_chats",currentChatId),{unread:unreadMap},{merge:true});}catch(e){}listenMessages()}
window.openGroup=openGroup;window.openPrivate=openPrivate;
function showChat(){document.getElementById('mainView').style.display='none';document.getElementById('chatView').style.display='flex'}
window.closeChat=()=>{if(unsubMsgs)unsubMsgs();if(unsubChatMeta)unsubChatMeta();document.getElementById('chatView').style.display='none';document.getElementById('mainView').style.display='flex';currentChatId=null;currentChatOther=null;document.getElementById('typingIndicator').style.display='none';};
function toggleInputButtons(){let inp=document.getElementById('msgInput');let mic=document.getElementById('micBtn');let send=document.getElementById('sendBtn');let img=document.getElementById('imgBtn');if(!inp||!mic||!send) return;if(inp.value.trim().length>0){mic.style.display='none';img.style.display='none';send.style.display='flex';}else{mic.style.display='flex';img.style.display='flex';send.style.display='none';}}
document.getElementById('msgInput').addEventListener('input', ()=>{toggleInputButtons(); if(!currentChatId) return; let metaCol=currentChatType==='private'?"private_chats":"group_chats";let metaDoc2=doc(db,metaCol,currentChatId); setDoc(metaDoc2,{typing:{[currentUsername]:true}},{merge:true}); if(typingTimeout) clearTimeout(typingTimeout); typingTimeout=setTimeout(()=>{setDoc(metaDoc2,{typing:{[currentUsername]:false}},{merge:true});},1500);});
function listenMessages(){if(unsubMsgs)unsubMsgs();if(unsubChatMeta)unsubChatMeta();let box=document.getElementById('msgs');box.innerHTML='Loading...';let col;if(currentChatType==='private')col=collection(db,"private_chats",currentChatId,"messages");else if(currentChatType==='group')col=collection(db,"group_chats",currentChatId,"messages");else col=collection(db,"messages");let q=query(col,orderBy("time","asc"));unsubMsgs=onSnapshot(q,(snap)=>{box.innerHTML='';snap.forEach(d=>{let data=d.data();let div=document.createElement('div');let isMe=data.sender===currentUsername||data.uid===auth.currentUser?.uid;div.className='bubble '+(isMe?'me':'other');if(data.type==='voice' && data.audioBase64){let dur=data.duration||0;let id=d.id;div.innerHTML=`<div class="voice-bubble"><div class="voice-play" onclick="playVoiceBase64('${id}')" id="play-${id}">▶️</div><div class="voice-wave">${Array(16).fill(0).map(()=>`<div class="voice-wave-bar" style="height:${8+Math.random()*16}px"></div>`).join('')}</div><div class="voice-meta"><span class="voice-duration">${formatTime(dur)}</span></div></div>`;div.dataset.audio=data.audioBase64;div.dataset.mime=data.mimeType||'audio/webm';}else if(data.type==='image' && data.imageBase64){div.classList.add('image-bubble');div.innerHTML=`<img src="data:image/jpeg;base64,${data.imageBase64}" onclick="window.open(this.src)"><div style="font-size:12px;margin-top:4px;opacity:0.8">${data.text||''}</div>`;}else{div.textContent=data.text||'';}if(isMe){div.ondblclick=()=>{if(confirm('Delete message?')) deleteDoc(doc(col,d.id));};}box.appendChild(div)});box.scrollTop=box.scrollHeight});}
window.playVoiceBase64=(id)=>{let bubble=document.querySelector(`#play-${id}`)?.closest('.bubble');if(!bubble) return;let base64=bubble.dataset.audio;let mime=bubble.dataset.mime||'audio/webm';if(currentAudio){currentAudio.pause();let old=document.getElementById('play-'+currentPlayingId);if(old) old.textContent='▶️';if(currentPlayingId===id){currentAudio=null;currentPlayingId=null;return;}}try{let binary=atob(base64);let bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);let blob=new Blob([bytes],{type:mime});let url=URL.createObjectURL(blob);let audio=new Audio(url);currentAudio=audio;currentPlayingId=id;let btn=document.getElementById('play-'+id);if(btn) btn.textContent='⏸️';audio.onended=()=>{if(btn) btn.textContent='▶️';URL.revokeObjectURL(url);currentAudio=null;currentPlayingId=null;};audio.play().catch(()=>{alert('Play failed');});}catch(e){alert('Error: '+e.message);}};
function blobToBase64(blob){return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onloadend=()=>{let base64=reader.result.split(',')[1];resolve(base64);};reader.onerror=reject;reader.readAsDataURL(blob);});}
async function startRecording(){if(isRecording) return;try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});let mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':MediaRecorder.isTypeSupported('audio/mp4')?'audio/mp4':'audio/webm';mediaRecorder=new MediaRecorder(stream,{mimeType:mime});audioChunks=[];mediaRecorder.ondataavailable=e=>{if(e.data.size>0) audioChunks.push(e.data);};mediaRecorder.onstop=async()=>{await handleRecordingStop(mime);stream.getTracks().forEach(t=>t.stop());};mediaRecorder.start();isRecording=true;recStartTime=Date.now();document.getElementById('msgInput').style.display='none';document.getElementById('recordingBar').classList.add('active');document.getElementById('micBtn').classList.add('recording');document.getElementById('micBtn').textContent='⏹️';recTimerInterval=setInterval(()=>{let elapsed=Math.floor((Date.now()-recStartTime)/1000);document.getElementById('recTimer').textContent=formatTime(elapsed);if(elapsed>=MAX_DURATION){stopRecording();}},200);}catch(err){alert('Mic denied: '+err.message);}}
async function stopRecording(){if(!isRecording||!mediaRecorder) return;isRecording=false;clearInterval(recTimerInterval);document.getElementById('recordingBar').classList.remove('active');document.getElementById('micBtn').classList.remove('recording');document.getElementById('micBtn').textContent='🎤';document.getElementById('msgInput').style.display='block';if(mediaRecorder.state!=='inactive') mediaRecorder.stop();}
async function handleRecordingStop(mimeType){if(audioChunks.length===0) return;let blob=new Blob(audioChunks,{type:mimeType});let duration=Math.floor((Date.now()-recStartTime)/1000);if(duration<1){alert('Too short');return;}if(duration>MAX_DURATION) duration=MAX_DURATION;document.getElementById('chatStatus').textContent='saving voice...';try{let base64=await blobToBase64(blob);if(base64.length>900000){alert('Voice too long! Keep under 30s');document.getElementById('chatStatus').textContent='online';return;}if(!currentChatId) throw new Error('No chat');let col;if(currentChatType==='private')col=collection(db,"private_chats",currentChatId,"messages");else if(currentChatType==='group')col=collection(db,"group_chats",currentChatId,"messages");else col=collection(db,"messages");await addDoc(col,{type:'voice',audioBase64:base64,mimeType:mimeType,duration:duration,sender:currentUsername,uid:auth.currentUser.uid,time:serverTimestamp(),text:''});let lastTxt=`🎤 Voice ${formatTime(duration)}`;if(currentChatType==='private'){let other=currentChatOther||currentChatId.replace('private_','').split('_').find(p=>p!==currentUsername);let existing=cachePrivate.find(c=>c.id===currentChatId);let unreadMap=existing?.unread?{...existing.unread}:{};unreadMap[other]=(unreadMap[other]||0)+1;unreadMap[currentUsername]=0;await setDoc(doc(db,"private_chats",currentChatId),{lastMsg:lastTxt,lastTime:serverTimestamp(),participants:[currentUsername,other].sort(),unread:unreadMap},{merge:true});}if(currentChatType==='group'){let g=cacheGroups.find(x=>x.id===currentChatId);let members=g?.members||[];let existing=g?.unread?{...g.unread}:{};members.forEach(m=>{if(m!==currentUsername) existing[m]=(existing[m]||0)+1;});existing[currentUsername]=0;await setDoc(doc(db,"group_chats",currentChatId),{lastMsg:currentUsername+": "+lastTxt,lastTime:serverTimestamp(),unread:existing},{merge:true});}document.getElementById('chatStatus').textContent='online';}catch(e){alert('Failed: '+e.message);document.getElementById('chatStatus').textContent='online';}}
window.sendMsg=async()=>{let txt=document.getElementById('msgInput').value.trim();if(!txt||!currentChatId)return;document.getElementById('msgInput').value='';toggleInputButtons();document.getElementById('typingIndicator').style.display='none';let col;if(currentChatType==='private')col=collection(db,"private_chats",currentChatId,"messages");else if(currentChatType==='group')col=collection(db,"group_chats",currentChatId,"messages");else col=collection(db,"messages");await addDoc(col,{text:txt,sender:currentUsername,uid:auth.currentUser.uid,time:serverTimestamp(),type:'text'});if(currentChatId!=='general'){let metaCol=currentChatType==='private'?"private_chats":"group_chats";try{await setDoc(doc(db,metaCol,currentChatId),{typing:{[currentUsername]:false}},{merge:true});}catch(e){}}if(currentChatType==='private'){let other=currentChatOther||currentChatId.replace('private_','').split('_').find(p=>p!==currentUsername);let existing=cachePrivate.find(c=>c.id===currentChatId);let unreadMap=existing?.unread?{...existing.unread}:{};unreadMap[other]=(unreadMap[other]||0)+1;unreadMap[currentUsername]=0;await setDoc(doc(db,"private_chats",currentChatId),{lastMsg:txt,lastTime:serverTimestamp(),participants:[currentUsername,other].sort(),unread:unreadMap},{merge:true});}if(currentChatType==='group'){let g=cacheGroups.find(x=>x.id===currentChatId);let members=g?.members||[];let existing=g?.unread?{...g.unread}:{};members.forEach(m=>{if(m!==currentUsername) existing[m]=(existing[m]||0)+1;});existing[currentUsername]=0;await setDoc(doc(db,"group_chats",currentChatId),{lastMsg:currentUsername+": "+txt.slice(0,40),lastTime:serverTimestamp(),unread:existing},{merge:true});}};
let micBtn=document.getElementById('micBtn');micBtn.addEventListener('click',()=>{if(isRecording) stopRecording(); else startRecording();});
document.getElementById('profileInput').addEventListener('change',async(e)=>{let file=e.target.files[0];if(!file) return;if(file.size>5*1024*1024){alert('Image too big, max 5MB');return}document.getElementById('chatStatus').textContent='uploading profile...';try{let base64=await compressImage(file,200,0.7);await setDoc(doc(db,"user_profiles",currentUsername),{username:currentUsername,photo:base64,updated:serverTimestamp()},{merge:true});document.getElementById('myAvImg').src='data:image/jpeg;base64,'+base64;document.getElementById('myAvImg').style.display='block';document.getElementById('myAvTxt').style.display='none';closeProfileModal();alert('Profile pic updated!');}catch(err){alert('Failed: '+err.message)}e.target.value='';});
document.getElementById('imageInput').addEventListener('change',async(e)=>{let file=e.target.files[0];if(!file) return;if(!currentChatId){alert('Open a chat first');return}if(file.size>10*1024*1024){alert('Image too big max 10MB');return}document.getElementById('chatStatus').textContent='processing image...';try{let base64=await compressImage(file,800,0.65);if(base64.length>900000){base64=await compressImage(file,600,0.5);}let col;if(currentChatType==='private')col=collection(db,"private_chats",currentChatId,"messages");else if(currentChatType==='group')col=collection(db,"group_chats",currentChatId,"messages");else col=collection(db,"messages");let caption=prompt('Add caption (optional):')||'';await addDoc(col,{type:'image',imageBase64:base64,text:caption.slice(0,200),sender:currentUsername,uid:auth.currentUser.uid,time:serverTimestamp()});let lastTxt=`🖼️ ${caption?caption:'Image'}`;if(currentChatType==='private'){let other=currentChatOther||currentChatId.replace('private_','').split('_').find(p=>p!==currentUsername);let existing=cachePrivate.find(c=>c.id===currentChatId);let unreadMap=existing?.unread?{...existing.unread}:{};unreadMap[other]=(unreadMap[other]||0)+1;unreadMap[currentUsername]=0;await setDoc(doc(db,"private_chats",currentChatId),{lastMsg:lastTxt,lastTime:serverTimestamp(),participants:[currentUsername,other].sort(),unread:unreadMap},{merge:true});}if(currentChatType==='group'){let g=cacheGroups.find(x=>x.id===currentChatId);let members=g?.members||[];let existing=g?.unread?{...g.unread}:{};members.forEach(m=>{if(m!==currentUsername) existing[m]=(existing[m]||0)+1;});existing[currentUsername]=0;await setDoc(doc(db,"group_chats",currentChatId),{lastMsg:currentUsername+": "+lastTxt,lastTime:serverTimestamp(),unread:existing},{merge:true});}document.getElementById('chatStatus').textContent='online';}catch(err){alert('Image failed: '+err.message);document.getElementById('chatStatus').textContent='online';}e.target.value='';});
window.openProfileModal=(e,username)=>{if(e) e.stopPropagation(); let prof=profilesCache[username]; let imgEl=document.getElementById('profileModalImg'); let nameEl=document.getElementById('profileModalName'); let userEl=document.getElementById('profileModalUser'); let actions=document.getElementById('profileModalActions'); nameEl.textContent=username; userEl.textContent='@'+username+' • DANKCONNECT user'; if(prof&&prof.photo){ imgEl.src='data:image/jpeg;base64,'+prof.photo; imgEl.style.background='transparent'; } else { imgEl.src=''; imgEl.style.background='#0d00b3'; } if(username===currentUsername){ actions.innerHTML=`<button class="profile-modal-btn primary" onclick="document.getElementById('profileInput').click()">Change Pic 📸</button><button class="profile-modal-btn secondary" onclick="closeProfileModal()">Close</button>`; } else { actions.innerHTML=`<button class="profile-modal-btn primary" onclick="openChatFromModal()">Message</button><button class="profile-modal-btn secondary" onclick="closeProfileModal()">Close</button>`; } document.getElementById('profileModal').classList.add('active'); document.getElementById('profileModal').dataset.username=username; };
window.closeProfileModal=()=>{document.getElementById('profileModal').classList.remove('active');};
window.openChatFromModal=()=>{let u=document.getElementById('profileModal').dataset.username; if(!u) return; closeProfileModal(); if(u!==currentUsername) openPrivate(u); };
window.doLogout=()=>signOut(auth);
</script>
